name: Alpha.2 OD0 Owned-Device Handoff

on:
  workflow_dispatch:
  pull_request:
    branches:
      - jett/mk0-foundation
    paths:
      - 'tools/RUN-FINANCESENSOR-ALPHA2-OD0.ps1'
      - 'tools/RUN-FINANCESENSOR-ALPHA2-OD0.cmd'
      - 'tools/validate-alpha2-od0-owned-device-harness.mjs'
      - 'mk0/10-evidence/ALPHA2-OD0-OWNED-DEVICE-HANDOFF.md'
      - 'graph/alpha2-r2-owned-device-campaign.json'
      - 'graph/alpha2-human-intervention-gate.json'
      - 'graph/alpha2-canonical-candidate.json'
      - '.github/workflows/alpha2-od0-owned-device-harness.yml'
      - 'tools/validate-ci-runner-policy.mjs'
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - 'tools/RUN-FINANCESENSOR-ALPHA2-OD0.ps1'
      - 'tools/RUN-FINANCESENSOR-ALPHA2-OD0.cmd'
      - 'tools/validate-alpha2-od0-owned-device-harness.mjs'
      - 'mk0/10-evidence/ALPHA2-OD0-OWNED-DEVICE-HANDOFF.md'
      - 'graph/alpha2-r2-owned-device-campaign.json'
      - 'graph/alpha2-human-intervention-gate.json'
      - 'graph/alpha2-canonical-candidate.json'
      - '.github/workflows/alpha2-od0-owned-device-harness.yml'
      - 'tools/validate-ci-runner-policy.mjs'

permissions:
  contents: read

concurrency:
  group: financesensor-alpha2-od0-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-blocked-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate fail-closed OD0 boundary
        run: node tools/validate-alpha2-od0-owned-device-harness.mjs

      - name: Validate CI runner policy
        run: node tools/validate-ci-runner-policy.mjs

      - name: Preserve pre-signing physical boundary
        run: |
          set -euo pipefail
          echo 'ALPHA2_OD0_HANDOFF_PACKAGE=BLOCKED'
          echo 'CANDIDATE=0.2.0-alpha.2+2009'
          echo 'SIGNING_REQUEST_ALLOWED=YES'
          echo 'TRUSTED_EDGE_SIGNING_PASS=NO'
          echo 'OD0_EXECUTION_ALLOWED=NO'
          echo 'OWNED_DEVICE_UAT_REQUEST_ALLOWED=NO'
          echo 'PUBLIC_CI_ORIGINATED_OD0_PASS=0'
          echo 'R2_NEXT_GATE=R1_TRUSTED_EDGE_SIGNING'
          echo 'ADB_EXECUTED_BY_CI=0'
          echo 'DEVICE_TOUCHED_BY_CI=0'
          echo 'PHYSICAL_ALPHA2_PASS=NO'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
