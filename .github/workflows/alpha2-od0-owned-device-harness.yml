name: Alpha.2 OD0 Owned-Device Handoff
on:
  workflow_dispatch:
  pull_request:
    branches: [jett/mk0-foundation]
    paths: ['tools/validate-alpha2-od0-owned-device-harness.mjs','graph/alpha2-r2-owned-device-campaign.json','graph/alpha2-human-intervention-gate.json','graph/alpha2-canonical-candidate.json','.github/workflows/alpha2-od0-owned-device-harness.yml','tools/validate-ci-runner-policy.mjs']
  push:
    branches: [jett/mk0-foundation]
    paths: ['tools/validate-alpha2-od0-owned-device-harness.mjs','graph/alpha2-r2-owned-device-campaign.json','graph/alpha2-human-intervention-gate.json','graph/alpha2-canonical-candidate.json','.github/workflows/alpha2-od0-owned-device-harness.yml','tools/validate-ci-runner-policy.mjs']
permissions: {contents: read}
jobs:
  validate-blocked-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate OD0 blocked boundary
        run: node tools/validate-alpha2-od0-owned-device-harness.mjs
      - name: Validate CI runner policy
        run: node tools/validate-ci-runner-policy.mjs
      - name: Preserve pre-signing physical boundary
        run: |
          echo 'ALPHA2_OD0_HANDOFF_PACKAGE=NOT_GENERATED'
          echo 'CANDIDATE=0.2.0-alpha.2+2013'
          echo 'R1_TRUSTED_EDGE_SIGNING=REQUIRED'
          echo 'OD0_EXECUTION_ALLOWED=NO'
          echo 'OWNED_DEVICE_UAT_REQUEST_ALLOWED=NO'
          echo 'PUBLIC_CI_ORIGINATED_OD0_PASS=0'
          echo 'ADB_EXECUTED_BY_CI=0'
          echo 'DEVICE_TOUCHED_BY_CI=0'
          echo 'NEXT_GATE=R1_TRUSTED_EDGE_SIGNING'
          echo 'PHYSICAL_ALPHA2_PASS=NO'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
