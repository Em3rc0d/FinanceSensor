name: Alpha.2 Certification Ledger

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - jett/mk0-foundation
    paths:
      - 'graph/alpha2-certification-ledger.json'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'graph/alpha2-r2-owned-device-campaign.json'
      - 'graph/alpha2-human-intervention-gate.json'
      - 'tools/validate-alpha2-certification-ledger.mjs'
      - 'tools/validate-alpha2-canonical-candidate.mjs'
      - 'tools/validate-alpha2-r1-signing-handoff.mjs'
      - 'tools/validate-alpha2-r2-chain.mjs'
      - 'tools/validate-alpha2-human-intervention-gate.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'mk0/10-evidence/ALPHA2-CERTIFICATION-LEDGER.md'
      - '.github/workflows/alpha2-certification-ledger.yml'
  push:
    branches:
      - main
      - jett/mk0-foundation
    paths:
      - 'graph/alpha2-certification-ledger.json'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'graph/alpha2-r2-owned-device-campaign.json'
      - 'graph/alpha2-human-intervention-gate.json'
      - 'tools/validate-alpha2-certification-ledger.mjs'
      - 'tools/validate-alpha2-canonical-candidate.mjs'
      - 'tools/validate-alpha2-r1-signing-handoff.mjs'
      - 'tools/validate-alpha2-r2-chain.mjs'
      - 'tools/validate-alpha2-human-intervention-gate.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'mk0/10-evidence/ALPHA2-CERTIFICATION-LEDGER.md'
      - '.github/workflows/alpha2-certification-ledger.yml'

permissions:
  contents: read

concurrency:
  group: financesensor-alpha2-cert-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-certification-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recompute hash-linked certification ledger
        run: node tools/validate-alpha2-certification-ledger.mjs

      - name: Revalidate canonical candidate
        run: node tools/validate-alpha2-canonical-candidate.mjs

      - name: Revalidate R1 post-merge handoff
        run: node tools/validate-alpha2-r1-signing-handoff.mjs

      - name: Revalidate R2 fail-closed chain
        run: node tools/validate-alpha2-r2-chain.mjs

      - name: Revalidate human intervention boundary
        run: node tools/validate-alpha2-human-intervention-gate.mjs

      - name: Revalidate public CI routing
        run: node tools/validate-ci-runner-policy.mjs

      - name: Certification ledger summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ALPHA2_CERTIFICATION_LEDGER=PASS
          CANDIDATE=0.2.0-alpha.2+2012
          CHAIN_STATE=PRE_SIGNING_CONSENSUS_FROZEN
          HEAD_BLOCK_HASH=4fddbd426678fc8b16449ce345d2eca0aa1df45efd22ac33a73adbb7273ffae5
          NEXT_GATE=R1_TRUSTED_EDGE_SIGNING
          PRIOR_PHYSICAL_EVIDENCE_INHERITED=NO
          PRIVATE_SIGNING_MATERIAL_IN_CI=0
          OWNED_DEVICE_UAT_REQUEST_ALLOWED=NO
          PHYSICAL_ALPHA2_PASS=NO
          BUILD_READY=NO
          RELEASE_READY=NO
          EOF
