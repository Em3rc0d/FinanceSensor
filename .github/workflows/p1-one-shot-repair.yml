name: FinanceSensor P1 One-Shot Repair

on:
  push:
    branches:
      - jett/p1-production-lifecycle-hardening
    paths:
      - '.github/workflows/p1-one-shot-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: jett/p1-production-lifecycle-hardening
          fetch-depth: 0

      - name: Repair synthetic FULL marker contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('spikes/physical-ingress/live/owned-oauth-p1-production-lifecycle.mjs')
          text = path.read_text()
          old = "const probeBody = 'Synthetic purchase evidence only. PEN 12.34; Merchant: DEMO STORE; Operation: DEMO-P1.';"
          new = "const probeBody = `Synthetic purchase evidence only. Marker: ${probeMarker}. PEN 12.34; Merchant: DEMO STORE; Operation: DEMO-P1.`;"
          if old not in text:
              raise SystemExit('P1_ONE_SHOT_REPAIR=FAIL: expected probeBody source not found')
          path.write_text(text.replace(old, new, 1))
          print('P1_SYNTHETIC_FULL_MARKER_REPAIR=APPLIED')
          PY

      - name: Syntax check P1 harness
        run: node --check spikes/physical-ingress/live/owned-oauth-p1-production-lifecycle.mjs

      - name: Validate P1 lifecycle contract
        run: node tools/validate-p1-production-lifecycle.mjs

      - name: Validate P1 local result reducer
        run: node tools/validate-p1-result-reducer.mjs

      - name: Validate Q-003 evidence boundary
        run: node tools/validate-q003-evidence.mjs

      - name: Validate physical campaign
        run: node tools/validate-physical-campaign.mjs

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/p1-one-shot-repair.yml
          git config user.name "FinanceSensor CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add spikes/physical-ingress/live/owned-oauth-p1-production-lifecycle.mjs .github/workflows/p1-one-shot-repair.yml
          git commit -m "fix(p1): bind synthetic marker to FULL probe body"
          git push origin HEAD:jett/p1-production-lifecycle-hardening
