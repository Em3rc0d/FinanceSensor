name: FinanceSensor Gmail Historical Finalize

on:
  push:
    branches:
      - jett/gmail-historical-onboarding
    paths:
      - '.github/workflows/gmail-historical-finalize.yml'
      - 'tools/apply-gmail-historical-wiring.mjs'

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gmail historical branch
        uses: actions/checkout@v4
        with:
          ref: jett/gmail-historical-onboarding
          fetch-depth: 0

      - name: Apply deterministic historical wiring
        run: node tools/apply-gmail-historical-wiring.mjs

      - name: Syntax check historical path
        run: |
          node --check spikes/physical-ingress/src/transaction-evidence-adapters.js
          node --check spikes/physical-ingress/src/historical-gmail-importer.js
          node --check spikes/physical-ingress/src/gmail-rest-provider.js
          node --check spikes/canonical-resolver/src/resolver.js

      - name: Adapter and historical importer tests
        working-directory: spikes/physical-ingress
        run: node --test test/transaction-evidence-adapters.test.js test/historical-gmail-importer.test.js

      - name: Full physical-ingress regression
        working-directory: spikes/physical-ingress
        run: npm test

      - name: Evidence-channel reconciliation tests
        working-directory: spikes/canonical-resolver
        run: node --test test/evidence-channel-reconciliation.test.js

      - name: Full canonical resolver regression
        working-directory: spikes/canonical-resolver
        run: npm test

      - name: Validate Gmail historical contract
        run: node tools/validate-gmail-historical-onboarding.mjs

      - name: Validate Q-003 boundary
        run: node tools/validate-q003-evidence.mjs

      - name: Validate physical campaign
        run: node tools/validate-physical-campaign.mjs

      - name: Commit wiring and remove one-shot machinery
        shell: bash
        run: |
          rm -f .github/workflows/gmail-historical-finalize.yml tools/apply-gmail-historical-wiring.mjs
          git config user.name 'FinanceSensor Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add spikes/physical-ingress/src/gmail-rest-provider.js spikes/physical-ingress/src/transaction-evidence-adapters.js spikes/canonical-resolver/src/resolver.js .github/workflows/gmail-historical-finalize.yml tools/apply-gmail-historical-wiring.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'chore(gmail): wire historical provider and evidence reconciliation'
            git push origin HEAD:jett/gmail-historical-onboarding
          fi
