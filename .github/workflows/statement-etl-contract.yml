name: FinanceSensor Statement ETL Contract

on:
  pull_request:
    branches:
      - jett/mk0-foundation
    paths:
      - 'graph/statement-etl-reconciliation.json'
      - 'graph/statement-format-registry.json'
      - 'mk0/01-mining-site/STATEMENT-REAL-FORMAT-DISCOVERY-2026-09-03.md'
      - 'mk0/03-design/MONTHLY-CLOSE-EXPERIENCE.md'
      - 'mk0/03-design/PRODUCT-DESIGN.md'
      - 'mk0/04-architecture/STATEMENT-ETL-RECONCILIATION.md'
      - 'mk0/05-data-model/STATEMENT-RECONCILIATION-MODEL.md'
      - 'mk0/05-data-model/CORE-DATA-MODEL.md'
      - 'mk0/07-plan/STATEMENT-ADAPTER-ROLLOUT.md'
      - 'mk0/09-test/STATEMENT-ETL-TEST-MATRIX.md'
      - 'mk0/11-decisions/ADR-035-STATEMENT-ETL-MONTHLY-RECONCILIATION.md'
      - 'mk0/11-decisions/ADR-INDEX.md'
      - 'spikes/physical-ingress/src/pdfjs-statement-parser.js'
      - 'spikes/physical-ingress/src/statement-page-classifier.js'
      - 'spikes/physical-ingress/src/statement-row-parser.js'
      - 'spikes/physical-ingress/src/statement-source-adapters.js'
      - 'spikes/physical-ingress/test/pdfjs-statement-parser.test.js'
      - 'spikes/physical-ingress/test/statement-page-classifier.test.js'
      - 'spikes/physical-ingress/test/statement-row-parser.test.js'
      - 'spikes/physical-ingress/test/statement-source-adapters.test.js'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'tools/validate-statement-etl-reconciliation.mjs'
      - '.github/workflows/statement-etl-contract.yml'
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - 'graph/statement-etl-reconciliation.json'
      - 'graph/statement-format-registry.json'
      - 'mk0/01-mining-site/STATEMENT-REAL-FORMAT-DISCOVERY-2026-09-03.md'
      - 'mk0/03-design/MONTHLY-CLOSE-EXPERIENCE.md'
      - 'mk0/03-design/PRODUCT-DESIGN.md'
      - 'mk0/04-architecture/STATEMENT-ETL-RECONCILIATION.md'
      - 'mk0/05-data-model/STATEMENT-RECONCILIATION-MODEL.md'
      - 'mk0/05-data-model/CORE-DATA-MODEL.md'
      - 'mk0/07-plan/STATEMENT-ADAPTER-ROLLOUT.md'
      - 'mk0/09-test/STATEMENT-ETL-TEST-MATRIX.md'
      - 'mk0/11-decisions/ADR-035-STATEMENT-ETL-MONTHLY-RECONCILIATION.md'
      - 'mk0/11-decisions/ADR-INDEX.md'
      - 'spikes/physical-ingress/src/pdfjs-statement-parser.js'
      - 'spikes/physical-ingress/src/statement-page-classifier.js'
      - 'spikes/physical-ingress/src/statement-row-parser.js'
      - 'spikes/physical-ingress/src/statement-source-adapters.js'
      - 'spikes/physical-ingress/test/pdfjs-statement-parser.test.js'
      - 'spikes/physical-ingress/test/statement-page-classifier.test.js'
      - 'spikes/physical-ingress/test/statement-row-parser.test.js'
      - 'spikes/physical-ingress/test/statement-source-adapters.test.js'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'tools/validate-statement-etl-reconciliation.mjs'
      - '.github/workflows/statement-etl-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate statement ETL architecture
        run: node tools/validate-statement-etl-reconciliation.mjs

      - name: Statement page-scope regression
        run: |
          node --check spikes/physical-ingress/src/pdfjs-statement-parser.js
          node --check spikes/physical-ingress/src/statement-page-classifier.js
          node --check spikes/physical-ingress/src/statement-row-parser.js
          node --check spikes/physical-ingress/src/statement-source-adapters.js
          node --test \
            spikes/physical-ingress/test/pdfjs-statement-parser.test.js \
            spikes/physical-ingress/test/statement-page-classifier.test.js \
            spikes/physical-ingress/test/statement-row-parser.test.js \
            spikes/physical-ingress/test/statement-source-adapters.test.js

      - name: Public trust boundary
        run: |
          ! grep -R -E -i "(password[[:space:]]*[:=][[:space:]]*['\"][^'\"]+|dni[[:space:]]*[:=][[:space:]]*[0-9]{6,}|account(number)?[[:space:]]*[:=][[:space:]]*[0-9]{8,}|card(number)?[[:space:]]*[:=][[:space:]]*[0-9]{8,})" \
            graph/statement-etl-reconciliation.json \
            graph/statement-format-registry.json \
            mk0/01-mining-site/STATEMENT-REAL-FORMAT-DISCOVERY-2026-09-03.md \
            mk0/03-design/MONTHLY-CLOSE-EXPERIENCE.md \
            mk0/03-design/PRODUCT-DESIGN.md \
            mk0/04-architecture/STATEMENT-ETL-RECONCILIATION.md \
            mk0/05-data-model/STATEMENT-RECONCILIATION-MODEL.md \
            mk0/05-data-model/CORE-DATA-MODEL.md \
            mk0/07-plan/STATEMENT-ADAPTER-ROLLOUT.md \
            mk0/09-test/STATEMENT-ETL-TEST-MATRIX.md \
            mk0/11-decisions/ADR-035-STATEMENT-ETL-MONTHLY-RECONCILIATION.md \
            mk0/11-decisions/ADR-INDEX.md \
            spikes/physical-ingress/src/pdfjs-statement-parser.js \
            spikes/physical-ingress/src/statement-page-classifier.js \
            spikes/physical-ingress/src/statement-row-parser.js \
            spikes/physical-ingress/src/statement-source-adapters.js \
            spikes/physical-ingress/test/pdfjs-statement-parser.test.js \
            spikes/physical-ingress/test/statement-page-classifier.test.js \
            spikes/physical-ingress/test/statement-row-parser.test.js \
            spikes/physical-ingress/test/statement-source-adapters.test.js
          echo 'REAL_STATEMENT_DATA_IN_CI=0'
          echo 'REAL_GMAIL_IN_CI=0'
          echo 'IOS_TOUCHED=0'
          echo 'BUILD_READY=false'
