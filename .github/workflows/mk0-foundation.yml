name: MK0 Foundation

on:
  push:
    branches:
      - main
      - jett/mk0-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  canonical-resolver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/canonical-resolver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify resolver invariants
        run: npm test

  e2ee-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/e2ee-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify peripheral and parasympathetic invariants
        run: npm test

  physical-ingress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/physical-ingress
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify ingress, recovery and privacy invariants
        run: npm test
