name: Package Gmail Level C Helper

on:
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - '.github/workflows/package-level-c-helper.yml'
      - 'spikes/physical-ingress/**'
      - 'spikes/canonical-resolver/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify controlled v2 runner before packaging
        run: |
          node --check spikes/physical-ingress/live/owned-oauth-level-c-v2.mjs
          grep -q "MAX_MESSAGES = 5" spikes/physical-ingress/live/owned-oauth-level-c-v2.mjs
          grep -q "MAX_FULL_MESSAGES = 1" spikes/physical-ingress/live/owned-oauth-level-c-v2.mjs
          grep -q "messagesListUsed: false" spikes/physical-ingress/live/owned-oauth-level-c-v2.mjs
          grep -q "loopbackRootRedirect: true" spikes/physical-ingress/live/owned-oauth-level-c-v2.mjs
          ! grep -qi "client_secret" spikes/physical-ingress/live/owned-oauth-level-c-v2.mjs

      - name: Build helper directory
        run: |
          mkdir -p FinanceSensor-Level-C-v2/spikes
          cp -R spikes/physical-ingress FinanceSensor-Level-C-v2/spikes/
          cp -R spikes/canonical-resolver FinanceSensor-Level-C-v2/spikes/
          cat > FinanceSensor-Level-C-v2/START-HERE.txt <<'EOF'
          FinanceSensor Gmail Level C v2 — controlled DEV probe

          1. Open: spikes\physical-ingress\live\RUN-FINANCESENSOR-LEVEL-C.cmd
          2. The browser opens locally.
          3. Click "Authorize FinanceSensor DEV" and use ONLY the configured test Gmail account.
          4. After authorization, send one harmless synthetic test email using the text shown locally.
          5. Run the bounded probe, then revoke access.
          6. Upload ONLY financesensor-level-c-result.json to ChatGPT.

          Do not upload OAuth tokens, Google credential JSON, authorization codes, PKCE values,
          Gmail message bodies, or real financial data.

          v2 boundaries:
          - Desktop loopback root redirect only: http://127.0.0.1:<ephemeral-port>
          - no historical messages.list sweep
          - max 5 post-authorization changed messages per attempt
          - max 1 FULL fetch
          - max 2 bounded probe attempts
          - OAuth error diagnostics are allowlisted codes only
          EOF

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: FinanceSensor-Level-C-v2-Windows
          path: FinanceSensor-Level-C-v2
          if-no-files-found: error
          retention-days: 7
