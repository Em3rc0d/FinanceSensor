name: Alpha.2 R1 Trusted-Edge Signing

on:
  workflow_dispatch:
  pull_request:
    branches: [jett/mk0-foundation]
    paths:
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1'
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd'
      - 'tools/validate-alpha2-canonical-candidate.mjs'
      - 'tools/validate-alpha2-r1-signing-handoff.mjs'
      - 'tools/validate-alpha2-r1-ci-routing-receipt.mjs'
      - 'tools/validate-alpha2-human-intervention-gate.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'graph/alpha2-human-intervention-gate.json'
      - 'graph/physical-receipts/ALPHA2-R1-TRUSTED-EDGE-SIGNING-2012-2026-09-15.json'
      - '.github/workflows/alpha2-r1-trusted-edge-signing.yml'
  push:
    branches: [jett/mk0-foundation]
    paths:
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1'
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd'
      - 'tools/validate-alpha2-canonical-candidate.mjs'
      - 'tools/validate-alpha2-r1-signing-handoff.mjs'
      - 'tools/validate-alpha2-r1-ci-routing-receipt.mjs'
      - 'tools/validate-alpha2-human-intervention-gate.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'graph/alpha2-human-intervention-gate.json'
      - 'graph/physical-receipts/ALPHA2-R1-TRUSTED-EDGE-SIGNING-2012-2026-09-15.json'
      - '.github/workflows/alpha2-r1-trusted-edge-signing.yml'
permissions: {contents: read, actions: read}
concurrency:
  group: financesensor-alpha2-r1-signing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-r1-signing-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Human intervention gate
        run: node tools/validate-alpha2-human-intervention-gate.mjs
      - name: Canonical Alpha.2 +2012 boundary
        run: node tools/validate-alpha2-canonical-candidate.mjs
      - name: R1 v12 trusted-edge handoff boundary
        run: node tools/validate-alpha2-r1-signing-handoff.mjs
      - name: R1 CI routing boundary
        run: node tools/validate-alpha2-r1-ci-routing-receipt.mjs
      - name: CI runner governance
        run: node tools/validate-ci-runner-policy.mjs
      - name: Download exact canonical +2012 artifact
        uses: actions/download-artifact@v4
        with:
          name: financesensor-alpha2-2012-candidate-34983489697
          path: canonical-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34983489697
      - name: Verify immutable canonical +2012 input
        shell: bash
        run: |
          set -euo pipefail
          APK='canonical-artifact/build/app/outputs/flutter-apk/app-debug.apk'
          EVIDENCE='canonical-artifact/alpha2-integrated-ci-evidence.txt'
          test -f "$APK" && test -f "$EVIDENCE"
          test "$(sha256sum "$APK"|awk '{print $1}')" = '74e690e9858fd0ef72d0e39f0863371fa1f1f9cfa726a5078e237d33439c587e'
          test "$(stat -c '%s' "$APK")" = '182538547'
          grep -q '^SOURCE_COMMIT=b75cc39318ee749a1123971f19d895d71e35bd91$' "$EVIDENCE"
          grep -q '^CANDIDATE_ID=0.2.0-alpha.2+2012$' "$EVIDENCE"
          grep -q '^APK_SIGNATURE_VERIFY=PASS$' "$EVIDENCE"
          grep -q '^APK_AAPT2_PARSE=PASS$' "$EVIDENCE"
          grep -q '^RIPLEY_CREDIT_STRICT_ADAPTER=A2_RIPLEY_CREDIT_STRICT_V1$' "$EVIDENCE"
          grep -q '^BCP_CREDIT_MODE=STRUCTURAL_PROBE_ONLY$' "$EVIDENCE"
          grep -q '^BCP_CREDIT_FINANCIAL_EVIDENCE_EMISSION=NO$' "$EVIDENCE"
          grep -q '^EXACT_FETCH_ENABLED_PROFILES=3$' "$EVIDENCE"
          grep -q '^POST_PASSWORD_IMPORT_ISOLATION=YES$' "$EVIDENCE"
          grep -q '^STATEMENT_FAILURE_BLOCKS_SAFE_PROJECTION=NO$' "$EVIDENCE"
          echo 'CANONICAL_2012_INPUT=PASS'
      - name: Regenerate deterministic public-safe v12 bundle for reproducibility
        shell: bash
        run: |
          set -euo pipefail
          APK='canonical-artifact/build/app/outputs/flutter-apk/app-debug.apk'
          EVIDENCE='canonical-artifact/alpha2-integrated-ci-evidence.txt'
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -mindepth 3 -maxdepth 3 -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          test -f "$APKSIGNER_JAR"
          test "$(sha256sum "$APKSIGNER_JAR"|awk '{print $1}')" = '2defad215d7ff52968a409cde528cdaef7918b115e276b8e3378ca7a178e4180'
          test "$(git hash-object tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1)" = '0f8cae791b4d57beda7accef9f4cbd39acc5fdd9'
          test "$(git hash-object tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd)" = '3d01373b69051d30f88a57f26fa815e52d952d6d'
          ROOT="$RUNNER_TEMP/financesensor-r1-v12"
          BUNDLE_DIR="$ROOT/FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v12"
          OUT="$GITHUB_WORKSPACE/FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v12.zip"
          rm -rf "$ROOT" "$OUT"; mkdir -p "$BUNDLE_DIR/public-signing-tool/lib"
          cp "$APK" "$BUNDLE_DIR/FinanceSensor-ALPHA2-CANONICAL-INPUT.apk"
          cp tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1 "$BUNDLE_DIR/"
          cp tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd "$BUNDLE_DIR/"
          cp "$APKSIGNER_JAR" "$BUNDLE_DIR/public-signing-tool/lib/apksigner.jar"
          cp "$EVIDENCE" "$BUNDLE_DIR/CANONICAL-CI-EVIDENCE.txt"
          cat > "$BUNDLE_DIR/BUNDLE-README.txt" <<'README'
          FinanceSensor Alpha.2 +2012 — R1 trusted-edge signing bundle v12

          This is the frozen +2012 candidate containing BCP Savings V2, strict Banco Ripley credit parsing, and privacy-safe BCP credit structural probing.

          1. Extract this ZIP on the owned Windows trusted edge.
          2. Double-click SIGN-FINANCESENSOR-ALPHA2-R2.cmd.
          3. Select the private FINANCESENSOR_R2_LAB keystore locally.
          4. Enter the password only in the local prompt.
          5. Return only the generated .receipt.txt after PASS.

          Never upload the keystore, password, private key, OAuth token, Gmail content or financial plaintext.
          Expected package: com.financesensor.lab.gmailconnection.r2
          Expected scope: gmail.readonly
          Expected stable signer SHA1: 63:2F:3A:4C:AE:C6:86:5B:C4:02:E8:82:12:2E:33:38:A6:EF:EB:D0
          README
          cat > "$BUNDLE_DIR/SOURCE.txt" <<'SOURCE'
          CANDIDATE=0.2.0-alpha.2+2012
          PRODUCT_SOURCE_COMMIT=e46eef4f406dec3220d3f1a2bda51bf7a4fd7202
          CANONICAL_SOURCE_COMMIT=b75cc39318ee749a1123971f19d895d71e35bd91
          CANONICAL_RUN_ID=34983489697
          CANONICAL_JOB_ID=104429538724
          CANONICAL_ARTIFACT_ID=10402582806
          CANONICAL_ARTIFACT_ZIP_SHA256=0f67c95372e5ce2e4ed21ff4724bf25f4bb5c7553f228faf6302ad62935b37d3
          CANONICAL_ARTIFACT_ZIP_BYTES=87684356
          INPUT_APK_SHA256=74e690e9858fd0ef72d0e39f0863371fa1f1f9cfa726a5078e237d33439c587e
          INPUT_APK_BYTES=182538547
          SIGNER_PS1_GIT_BLOB=0f8cae791b4d57beda7accef9f4cbd39acc5fdd9
          SIGNER_CMD_GIT_BLOB=3d01373b69051d30f88a57f26fa815e52d952d6d
          APKSIGNER_SHA256=2defad215d7ff52968a409cde528cdaef7918b115e276b8e3378ca7a178e4180
          SOURCE
          (cd "$BUNDLE_DIR"; find . -type f ! -name 'BUNDLE-MANIFEST-SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > BUNDLE-MANIFEST-SHA256.txt; sha256sum -c BUNDLE-MANIFEST-SHA256.txt)
          python3 - "$BUNDLE_DIR" "$OUT" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); prefix=root.name
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  rel=pathlib.PurePosixPath(prefix)/path.relative_to(root).as_posix()
                  info=zipfile.ZipInfo(str(rel),date_time=(2020,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
                  zf.writestr(info,path.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          unzip -t "$OUT" >/dev/null
          test "$(zipinfo -1 "$OUT"|grep -v '/$'|wc -l)" = '8'
          BUNDLE_SHA256="$(sha256sum "$OUT"|awk '{print $1}')"; BUNDLE_BYTES="$(stat -c '%s' "$OUT")"
          test "$BUNDLE_SHA256" = 'd6c9538b0c84d0bdabc966847cd7f6d340bd17eea68bf69e65d3d2a852585642'
          test "$BUNDLE_BYTES" = '86659710'
          cat > "$GITHUB_WORKSPACE/FinanceSensor-ALPHA2-R1-BUNDLE-v12-AUDIT.txt" <<AUDIT
          R1_V12_GENERATION=PASS
          R1_V12_FROZEN_BYTES=PASS
          BUNDLE_SHA256=${BUNDLE_SHA256}
          BUNDLE_BYTES=${BUNDLE_BYTES}
          BUNDLE_FILES=8
          PRIVATE_KEY_FILES=0
          SECRET_LIKE_VALUE_MATCHES=0
          PRIVATE_SIGNING_MATERIAL_IN_CI=0
          PUBLIC_CI_ORIGINATED_PHYSICAL_PASS=0
          SIGNING_REQUEST_ALLOWED=NO
          R1_TRUSTED_EDGE_SIGNING=PASS
          OWNED_DEVICE_UAT_REQUEST_ALLOWED=YES
          PHYSICAL_ALPHA2_PASS=NO
          BUILD_READY=NO
          RELEASE_READY=NO
          AUDIT
      - name: Upload v12 reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: financesensor-alpha2-r1-trusted-edge-bundle-v12-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v12.zip
            FinanceSensor-ALPHA2-R1-BUNDLE-v12-AUDIT.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve post-signing physical boundary
        run: |
          echo 'R1_V12_GENERATION=PASS'
          echo 'SIGNING_REQUEST_ALLOWED=NO'
          echo 'R1_TRUSTED_EDGE_SIGNING=PASS'
          echo 'OWNED_DEVICE_UAT_REQUEST_ALLOWED=YES'
          echo 'R2_NEXT_GATE=OD0_SIGNED_APK_INSTALL_AND_LAUNCH'
          echo 'PUBLIC_CI_ORIGINATED_PHYSICAL_PASS=0'
          echo 'PHYSICAL_ALPHA2_PASS=NO'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
