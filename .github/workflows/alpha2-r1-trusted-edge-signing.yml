name: Alpha.2 R1 Trusted-Edge Signing

on:
  workflow_dispatch:
  pull_request:
    branches: [jett/mk0-foundation]
    paths:
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1'
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd'
      - 'tools/validate-alpha2-canonical-candidate.mjs'
      - 'tools/validate-alpha2-r1-signing-handoff.mjs'
      - 'tools/validate-alpha2-human-intervention-gate.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'graph/alpha2-human-intervention-gate.json'
      - '.github/workflows/alpha2-r1-trusted-edge-signing.yml'
  push:
    branches: [jett/mk0-foundation]
    paths:
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1'
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd'
      - 'tools/validate-alpha2-canonical-candidate.mjs'
      - 'tools/validate-alpha2-r1-signing-handoff.mjs'
      - 'tools/validate-alpha2-human-intervention-gate.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'graph/alpha2-human-intervention-gate.json'
      - '.github/workflows/alpha2-r1-trusted-edge-signing.yml'

permissions: {contents: read, actions: read}
concurrency:
  group: financesensor-alpha2-r1-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-r1-signing-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Human intervention gate
        run: node tools/validate-alpha2-human-intervention-gate.mjs
      - name: Canonical Alpha.2 +2013 boundary
        run: node tools/validate-alpha2-canonical-candidate.mjs
      - name: R1 v13 trusted-edge handoff boundary
        run: node tools/validate-alpha2-r1-signing-handoff.mjs
      - name: CI runner governance
        run: node tools/validate-ci-runner-policy.mjs
      - name: Download exact canonical +2013 artifact
        uses: actions/download-artifact@v4
        with:
          name: financesensor-alpha2-2013-candidate-35043945554
          path: canonical-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35043945554
      - name: Verify immutable canonical +2013 input
        shell: bash
        run: |
          set -euo pipefail
          APK='canonical-artifact/build/app/outputs/flutter-apk/app-debug.apk'
          EVIDENCE='canonical-artifact/alpha2-integrated-ci-evidence.txt'
          test -f "$APK" && test -f "$EVIDENCE"
          test "$(sha256sum "$APK"|awk '{print $1}')" = 'bcb6db29b9fb567dcffc99d875674a6834938c837fd2fe7f1aa83cc29c3b0da1'
          test "$(stat -c '%s' "$APK")" = '182538547'
          grep -q '^SOURCE_COMMIT=fd6b2ba75a63e650626f2fcece6c13f0bea4f541$' "$EVIDENCE"
          grep -q '^CANDIDATE_ID=0.2.0-alpha.2+2013$' "$EVIDENCE"
          grep -q '^SCAN_RESILIENCE=A2_SCAN_RESILIENCE_V1$' "$EVIDENCE"
          grep -q '^TRANSACTION_STATEMENT_SCAN_ISOLATION=YES$' "$EVIDENCE"
          grep -q '^TRANSIENT_SCAN_RETRY_BOUNDED=YES$' "$EVIDENCE"
          grep -q '^REAUTH_FAIL_CLOSED=YES$' "$EVIDENCE"
          grep -q '^PARTIAL_SAFE_SOURCE_CONTINUATION=YES$' "$EVIDENCE"
          grep -q '^APK_SIGNATURE_VERIFY=PASS$' "$EVIDENCE"
          grep -q '^APK_AAPT2_PARSE=PASS$' "$EVIDENCE"
          echo 'CANONICAL_2013_INPUT=PASS'
      - name: Regenerate deterministic frozen v13 bundle
        shell: bash
        run: |
          set -euo pipefail
          APK='canonical-artifact/build/app/outputs/flutter-apk/app-debug.apk'
          EVIDENCE='canonical-artifact/alpha2-integrated-ci-evidence.txt'
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -mindepth 3 -maxdepth 3 -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          test -f "$APKSIGNER_JAR"
          test "$(sha256sum "$APKSIGNER_JAR"|awk '{print $1}')" = '2defad215d7ff52968a409cde528cdaef7918b115e276b8e3378ca7a178e4180'
          test "$(git hash-object tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1)" = '5235dd6a858f6734997b333adc6913eb9790c9be'
          test "$(git hash-object tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd)" = '3d01373b69051d30f88a57f26fa815e52d952d6d'
          ROOT="$RUNNER_TEMP/financesensor-r1-v13"
          BUNDLE_DIR="$ROOT/FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v13"
          OUT="$GITHUB_WORKSPACE/FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v13.zip"
          rm -rf "$ROOT" "$OUT"; mkdir -p "$BUNDLE_DIR/public-signing-tool/lib"
          cp "$APK" "$BUNDLE_DIR/FinanceSensor-ALPHA2-CANONICAL-INPUT.apk"
          cp tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1 "$BUNDLE_DIR/"
          cp tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd "$BUNDLE_DIR/"
          cp "$APKSIGNER_JAR" "$BUNDLE_DIR/public-signing-tool/lib/apksigner.jar"
          cp "$EVIDENCE" "$BUNDLE_DIR/CANONICAL-CI-EVIDENCE.txt"
          cat > "$BUNDLE_DIR/BUNDLE-README.txt" <<'README'
          FinanceSensor Alpha.2 +2013 — R1 trusted-edge signing bundle v13

          This is the frozen +2013 scan-resilience candidate produced after +2012 failed its first real Gmail refresh.

          1. Extract this ZIP on the owned Windows trusted edge.
          2. Double-click SIGN-FINANCESENSOR-ALPHA2-R2.cmd.
          3. Select the private FINANCESENSOR_R2_LAB keystore locally.
          4. Enter the password only in the local prompt.
          5. Return only the generated .receipt.txt after PASS.

          Never upload the keystore, password, private key, OAuth token, Gmail content or financial plaintext.
          Expected package: com.financesensor.lab.gmailconnection.r2
          Expected scope: gmail.readonly
          Expected stable signer SHA1: 63:2F:3A:4C:AE:C6:86:5B:C4:02:E8:82:12:2E:33:38:A6:EF:EB:D0
          README
          cat > "$BUNDLE_DIR/SOURCE.txt" <<'SOURCE'
          CANDIDATE=0.2.0-alpha.2+2013
          PRODUCT_SOURCE_COMMIT=da6176f9acba1854c470ce2caea471bb6b66d8f2
          CANONICAL_SOURCE_COMMIT=fd6b2ba75a63e650626f2fcece6c13f0bea4f541
          CANONICAL_RUN_ID=35043945554
          CANONICAL_JOB_ID=104629619526
          CANONICAL_ARTIFACT_ID=10425404905
          CANONICAL_ARTIFACT_ZIP_SHA256=86df2518365999197679bbf55e77f67a8f330fb9d9a2ef6b755dfd2c9b712ddd
          CANONICAL_ARTIFACT_ZIP_BYTES=87687486
          INPUT_APK_SHA256=bcb6db29b9fb567dcffc99d875674a6834938c837fd2fe7f1aa83cc29c3b0da1
          INPUT_APK_BYTES=182538547
          SIGNER_PS1_GIT_BLOB=5235dd6a858f6734997b333adc6913eb9790c9be
          SIGNER_CMD_GIT_BLOB=3d01373b69051d30f88a57f26fa815e52d952d6d
          APKSIGNER_SHA256=2defad215d7ff52968a409cde528cdaef7918b115e276b8e3378ca7a178e4180
          SCAN_RESILIENCE=A2_SCAN_RESILIENCE_V1
          SOURCE
          (cd "$BUNDLE_DIR"; find . -type f ! -name 'BUNDLE-MANIFEST-SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > BUNDLE-MANIFEST-SHA256.txt; sha256sum -c BUNDLE-MANIFEST-SHA256.txt)
          python3 - "$BUNDLE_DIR" "$OUT" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); prefix=root.name
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  rel=pathlib.PurePosixPath(prefix)/path.relative_to(root).as_posix()
                  info=zipfile.ZipInfo(str(rel),date_time=(2020,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
                  zf.writestr(info,path.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          unzip -t "$OUT" >/dev/null
          test "$(zipinfo -1 "$OUT"|grep -v '/$'|wc -l)" = '8'
          BUNDLE_SHA256="$(sha256sum "$OUT"|awk '{print $1}')"; BUNDLE_BYTES="$(stat -c '%s' "$OUT")"
          test "$BUNDLE_SHA256" = 'd8f981a35c121d0f75b3b42196b8af8a2fc9306ce5203df20b85a9c2830fadbc'
          test "$BUNDLE_BYTES" = '86659248'
          cat > "$GITHUB_WORKSPACE/FinanceSensor-ALPHA2-R1-BUNDLE-v13-AUDIT.txt" <<AUDIT
          R1_V13_GENERATION=PASS
          R1_V13_FROZEN_BYTES=PASS
          CANDIDATE=0.2.0-alpha.2+2013
          INPUT_APK_SHA256=bcb6db29b9fb567dcffc99d875674a6834938c837fd2fe7f1aa83cc29c3b0da1
          BUNDLE_SHA256=${BUNDLE_SHA256}
          BUNDLE_BYTES=${BUNDLE_BYTES}
          BUNDLE_FILES=8
          PRIVATE_KEY_FILES=0
          SECRET_LIKE_VALUE_MATCHES=0
          PRIVATE_SIGNING_MATERIAL_IN_CI=0
          PUBLIC_CI_ORIGINATED_PHYSICAL_PASS=0
          SIGNING_REQUEST_ALLOWED=YES
          R1_TRUSTED_EDGE_SIGNING=REQUIRED
          OWNED_DEVICE_UAT_REQUEST_ALLOWED=NO
          PHYSICAL_ALPHA2_PASS=NO
          BUILD_READY=NO
          RELEASE_READY=NO
          AUDIT
          cat "$GITHUB_WORKSPACE/FinanceSensor-ALPHA2-R1-BUNDLE-v13-AUDIT.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frozen v13 signing handoff
        uses: actions/upload-artifact@v4
        with:
          name: financesensor-alpha2-r1-trusted-edge-bundle-v13-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v13.zip
            FinanceSensor-ALPHA2-R1-BUNDLE-v13-AUDIT.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve pre-signing physical boundary
        run: |
          echo 'R1_V13_GENERATION=PASS'
          echo 'R1_V13_FROZEN_BYTES=PASS'
          echo 'R1_BUNDLE_SHA256=d8f981a35c121d0f75b3b42196b8af8a2fc9306ce5203df20b85a9c2830fadbc'
          echo 'SIGNING_REQUEST_ALLOWED=YES'
          echo 'R1_TRUSTED_EDGE_SIGNING=REQUIRED'
          echo 'OWNED_DEVICE_UAT_REQUEST_ALLOWED=NO'
          echo 'NEXT_GATE=R1_TRUSTED_EDGE_SIGNING'
          echo 'PUBLIC_CI_ORIGINATED_PHYSICAL_PASS=0'
          echo 'PHYSICAL_ALPHA2_PASS=NO'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
