name: Alpha.2 R1 Trusted-Edge Signing

on:
  workflow_dispatch:
  pull_request:
    branches:
      - jett/mk0-foundation
    paths:
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1'
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd'
      - 'tools/validate-alpha2-canonical-candidate.mjs'
      - 'tools/validate-alpha2-r1-signing-handoff.mjs'
      - 'tools/validate-alpha2-r1-ci-routing-receipt.mjs'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'mk0/10-evidence/EV-ALPHA2-CANONICAL-CANDIDATE-2026-09-07.md'
      - 'mk0/10-evidence/EV-ALPHA2-2003-PHYSICAL-INSTALLABILITY-OBSERVATION-2026-09-07.md'
      - 'mk0/10-evidence/EV-ALPHA2-R1-SIGNING-HANDOFF-2026-09-07.md'
      - 'mk0/10-evidence/EV-ALPHA2-R1-CI-ROUTING-2026-09-07.md'
      - '.github/workflows/alpha2-r1-trusted-edge-signing.yml'
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1'
      - 'tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd'
      - 'tools/validate-alpha2-canonical-candidate.mjs'
      - 'tools/validate-alpha2-r1-signing-handoff.mjs'
      - 'tools/validate-alpha2-r1-ci-routing-receipt.mjs'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'mk0/10-evidence/EV-ALPHA2-CANONICAL-CANDIDATE-2026-09-07.md'
      - 'mk0/10-evidence/EV-ALPHA2-2003-PHYSICAL-INSTALLABILITY-OBSERVATION-2026-09-07.md'
      - 'mk0/10-evidence/EV-ALPHA2-R1-SIGNING-HANDOFF-2026-09-07.md'
      - 'mk0/10-evidence/EV-ALPHA2-R1-CI-ROUTING-2026-09-07.md'
      - '.github/workflows/alpha2-r1-trusted-edge-signing.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: financesensor-alpha2-r1-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-r1-signing-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical Alpha.2 candidate boundary
        run: node tools/validate-alpha2-canonical-candidate.mjs

      - name: R1 trusted-edge handoff boundary
        run: node tools/validate-alpha2-r1-signing-handoff.mjs

      - name: R1 CI routing receipt
        run: node tools/validate-alpha2-r1-ci-routing-receipt.mjs

      - name: Download exact canonical +2003 artifact
        uses: actions/download-artifact@v4
        with:
          name: financesensor-alpha2-integrated-internal-c29a68e5326a187a7c82e6d66254ae05b6a4178a
          path: canonical-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34166127407

      - name: Verify immutable canonical input
        run: |
          set -euo pipefail
          APK='canonical-artifact/build/app/outputs/flutter-apk/app-debug.apk'
          EVIDENCE='canonical-artifact/alpha2-integrated-ci-evidence.txt'
          test -f "$APK"
          test -f "$EVIDENCE"
          test "$(sha256sum "$APK" | awk '{print $1}')" = '93d176b9f59b75a44ffcb9634d2a5620b2f0d63bbc75d80e2e1600a7d2cc5ad6'
          test "$(stat -c '%s' "$APK")" = '182090843'
          grep -q '^SOURCE_COMMIT=c29a68e5326a187a7c82e6d66254ae05b6a4178a$' "$EVIDENCE"
          grep -q '^CANDIDATE_ID=0.2.0-alpha.2+2003$' "$EVIDENCE"
          grep -q '^APK_SIGNATURE_VERIFY=PASS$' "$EVIDENCE"
          grep -q '^APK_AAPT2_PARSE=PASS$' "$EVIDENCE"
          grep -q '^ANDROID_MIN_SDK=31$' "$EVIDENCE"
          grep -q '^ANDROID_OAUTH_PACKAGE=com.financesensor.lab.gmailconnection.r2$' "$EVIDENCE"
          grep -q '^EXACT_SCOPE=gmail.readonly$' "$EVIDENCE"
          echo 'CANONICAL_2003_INPUT=PASS'

      - name: Build deterministic public-safe v5 handoff bundle
        run: |
          set -euo pipefail
          APK='canonical-artifact/build/app/outputs/flutter-apk/app-debug.apk'
          EVIDENCE='canonical-artifact/alpha2-integrated-ci-evidence.txt'
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -mindepth 3 -maxdepth 3 -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          test -f "$APKSIGNER_JAR"
          java -jar "$APKSIGNER_JAR" verify --print-certs "$APK" >/dev/null
          test "$(git hash-object tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1)" = 'efe59ef464007c8af9f67fd184926f74e403ca08'
          test "$(git hash-object tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd)" = '3d01373b69051d30f88a57f26fa815e52d952d6d'

          ROOT="$RUNNER_TEMP/financesensor-r1-v5"
          BUNDLE_DIR="$ROOT/FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v5"
          OUT="$GITHUB_WORKSPACE/FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v5.zip"
          rm -rf "$ROOT" "$OUT"
          mkdir -p "$BUNDLE_DIR/public-signing-tool/lib"
          cp "$APK" "$BUNDLE_DIR/FinanceSensor-ALPHA2-CANONICAL-INPUT.apk"
          cp tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1 "$BUNDLE_DIR/"
          cp tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd "$BUNDLE_DIR/"
          cp "$APKSIGNER_JAR" "$BUNDLE_DIR/public-signing-tool/lib/apksigner.jar"
          cp "$EVIDENCE" "$BUNDLE_DIR/CANONICAL-CI-EVIDENCE.txt"

          cat > "$BUNDLE_DIR/BUNDLE-README.txt" <<'EOF'
          FinanceSensor Alpha.2 +2003 — R1 trusted-edge signing bundle v5

          1. Extract this ZIP on the owned Windows trusted edge.
          2. Double-click SIGN-FINANCESENSOR-ALPHA2-R2.cmd.
          3. Select FinanceSensor-ALPHA2-CANONICAL-INPUT.apk.
          4. Select the private FINANCESENSOR_R2_LAB keystore locally.
          5. Enter the password only in the local prompt.
          6. Return only the generated .receipt.txt after PASS.

          Never upload the keystore, password, private key, OAuth token, Gmail content or financial plaintext.
          Expected package: com.financesensor.lab.gmailconnection.r2
          Expected scope: gmail.readonly
          Expected stable signer SHA1: 63:2F:3A:4C:AE:C6:86:5B:C4:02:E8:82:12:2E:33:38:A6:EF:EB:D0
          EOF

          cat > "$BUNDLE_DIR/SOURCE.txt" <<EOF
          CANDIDATE=0.2.0-alpha.2+2003
          SOURCE_COMMIT=c29a68e5326a187a7c82e6d66254ae05b6a4178a
          CANONICAL_RUN_ID=34166127407
          CANONICAL_JOB_ID=101877387416
          CANONICAL_ARTIFACT_ID=10034303033
          CANONICAL_ARTIFACT_ZIP_SHA256=17489354c2b3da1a3389c2fa991ac9d444f8eb58d031c030d05e0d20fbed481f
          INPUT_APK_SHA256=93d176b9f59b75a44ffcb9634d2a5620b2f0d63bbc75d80e2e1600a7d2cc5ad6
          INPUT_APK_BYTES=182090843
          SIGNER_PS1_GIT_BLOB=efe59ef464007c8af9f67fd184926f74e403ca08
          SIGNER_CMD_GIT_BLOB=3d01373b69051d30f88a57f26fa815e52d952d6d
          APKSIGNER_SHA256=$(sha256sum "$APKSIGNER_JAR" | awk '{print $1}')
          EOF

          (
            cd "$BUNDLE_DIR"
            find . -type f ! -name 'BUNDLE-MANIFEST-SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > BUNDLE-MANIFEST-SHA256.txt
          )

          python3 - "$BUNDLE_DIR" "$OUT" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          prefix = root.name
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  rel = pathlib.PurePosixPath(prefix) / path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(str(rel), date_time=(2020, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY

          unzip -t "$OUT" >/dev/null
          test "$(zipinfo -1 "$OUT" | grep -v '/$' | wc -l)" = '8'
          test "$(find "$BUNDLE_DIR" -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.pem' -o -iname '*.key' \) | wc -l)" = '0'
          if grep -R -a -E -n 'AIza[0-9A-Za-z_-]{20,}|ya29\.[0-9A-Za-z_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' "$BUNDLE_DIR"; then
            echo 'SECRET_LIKE_VALUE_MATCHES!=0'
            exit 1
          fi

          BUNDLE_SHA256="$(sha256sum "$OUT" | awk '{print $1}')"
          BUNDLE_BYTES="$(stat -c '%s' "$OUT")"
          test "$BUNDLE_SHA256" = '7f3dbb0570db5e403bb83334cc46590dcc51c1e6d2c12e78f295959ba7f83f33'
          test "$BUNDLE_BYTES" = '86226530'

          cat > "$GITHUB_WORKSPACE/FinanceSensor-ALPHA2-R1-BUNDLE-v5-AUDIT.txt" <<EOF
          BUNDLE_V5_GENERATION=PASS
          BUNDLE_NAME=FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v5.zip
          BUNDLE_SHA256=${BUNDLE_SHA256}
          BUNDLE_BYTES=${BUNDLE_BYTES}
          BUNDLE_FILES=8
          ZIP_STRUCTURE=PASS
          ZIP_INTEGRITY=PASS
          MANIFEST_INTEGRITY=PASS
          PRIVATE_KEY_FILES=0
          SECRET_LIKE_VALUE_MATCHES=0
          INPUT_APK_SHA256=93d176b9f59b75a44ffcb9634d2a5620b2f0d63bbc75d80e2e1600a7d2cc5ad6
          INPUT_APK_BYTES=182090843
          PS1_GIT_BLOB=$(git hash-object tools/SIGN-FINANCESENSOR-ALPHA2-R2.ps1)
          CMD_GIT_BLOB=$(git hash-object tools/SIGN-FINANCESENSOR-ALPHA2-R2.cmd)
          APKSIGNER_SHA256=$(sha256sum "$APKSIGNER_JAR" | awk '{print $1}')
          PRIVATE_SIGNING_MATERIAL_IN_CI=0
          R1_TRUSTED_EDGE_SIGNING=OPEN
          R2_OWNED_DEVICE_CAMPAIGN=BLOCKED_ON_R1
          BUILD_READY=NO
          RELEASE_READY=NO
          EOF
          cat "$GITHUB_WORKSPACE/FinanceSensor-ALPHA2-R1-BUNDLE-v5-AUDIT.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic v5 bundle
        uses: actions/upload-artifact@v4
        with:
          name: financesensor-alpha2-r1-trusted-edge-bundle-v5-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            FinanceSensor-ALPHA2-R1-TRUSTED-EDGE-BUNDLE-v5.zip
            FinanceSensor-ALPHA2-R1-BUNDLE-v5-AUDIT.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preserve physical boundary
        run: |
          set -euo pipefail
          echo 'R1_HANDOFF_READY=YES'
          echo 'R1_TRUSTED_EDGE_SIGNING=OPEN'
          echo 'R2_OWNED_DEVICE_CAMPAIGN=BLOCKED_ON_R1'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
