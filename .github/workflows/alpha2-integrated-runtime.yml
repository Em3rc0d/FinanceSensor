name: Alpha.2 Integrated Runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [jett/mk0-foundation]
    paths:
      - 'spikes/mobile-shell/lib/alpha2/**'
      - 'spikes/mobile-shell/lib/main_alpha2.dart'
      - 'spikes/mobile-shell/native/android/Alpha2*.kt'
      - 'spikes/mobile-shell/pubspec.yaml'
      - 'spikes/mobile-shell/test/alpha2_*_test.dart'
      - 'graph/alpha2-mobile-golden-vectors-v1.json'
      - 'graph/alpha2-mobile-runtime-authority.json'
      - 'graph/alpha2-credit-mobile-profile-authority.json'
      - 'graph/alpha2-scan-resilience-candidate.json'
      - 'graph/alpha2-strict-review-diagnostics-candidate.json'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r2-owned-device-campaign.json'
      - 'mk0/10-evidence/ALPHA2-CREDIT-MOBILE-PROFILE-AUTHORITY.md'
      - 'mk0/10-evidence/ALPHA2-2012-PHYSICAL-SCAN-FAILURE-2026-09-15.md'
      - 'mk0/10-evidence/ALPHA2-2013-STRICT-EECC-REVIEW-PHYSICAL-OBSERVATION-2026-09-17.md'
      - 'spikes/e2ee-sync/src/alpha2-projection-adapter.js'
      - 'spikes/e2ee-sync/test/alpha2-projection-adapter.test.js'
      - 'product/labs/web-dashboard/**'
      - 'tools/materialize-alpha2-android.py'
      - 'tools/validate-mobile-stack.mjs'
      - 'tools/validate-alpha2-mobile-golden-vectors.mjs'
      - 'tools/validate-alpha2-integrated-runtime.mjs'
      - 'tools/validate-alpha2-2014-candidate-cut.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - '.github/workflows/alpha2-integrated-runtime.yml'
  push:
    branches: [jett/mk0-foundation]
    paths:
      - 'spikes/mobile-shell/lib/alpha2/**'
      - 'spikes/mobile-shell/lib/main_alpha2.dart'
      - 'spikes/mobile-shell/native/android/Alpha2*.kt'
      - 'spikes/mobile-shell/pubspec.yaml'
      - 'spikes/mobile-shell/test/alpha2_*_test.dart'
      - 'graph/alpha2-mobile-golden-vectors-v1.json'
      - 'graph/alpha2-mobile-runtime-authority.json'
      - 'graph/alpha2-credit-mobile-profile-authority.json'
      - 'graph/alpha2-scan-resilience-candidate.json'
      - 'graph/alpha2-strict-review-diagnostics-candidate.json'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/alpha2-r2-owned-device-campaign.json'
      - 'mk0/10-evidence/ALPHA2-CREDIT-MOBILE-PROFILE-AUTHORITY.md'
      - 'mk0/10-evidence/ALPHA2-2012-PHYSICAL-SCAN-FAILURE-2026-09-15.md'
      - 'mk0/10-evidence/ALPHA2-2013-STRICT-EECC-REVIEW-PHYSICAL-OBSERVATION-2026-09-17.md'
      - 'spikes/e2ee-sync/src/alpha2-projection-adapter.js'
      - 'spikes/e2ee-sync/test/alpha2-projection-adapter.test.js'
      - 'product/labs/web-dashboard/**'
      - 'tools/materialize-alpha2-android.py'
      - 'tools/validate-mobile-stack.mjs'
      - 'tools/validate-alpha2-mobile-golden-vectors.mjs'
      - 'tools/validate-alpha2-integrated-runtime.mjs'
      - 'tools/validate-alpha2-2014-candidate-cut.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - '.github/workflows/alpha2-integrated-runtime.yml'

permissions:
  contents: read

concurrency:
  group: financesensor-alpha2-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: +2014 candidate cut boundary
        run: node tools/validate-alpha2-2014-candidate-cut.mjs

      - name: Integrated architecture boundary
        run: node tools/validate-alpha2-integrated-runtime.mjs

      - name: Mobile security baseline boundary
        run: node tools/validate-mobile-stack.mjs

      - name: Node reference golden vectors
        run: node tools/validate-alpha2-mobile-golden-vectors.mjs

      - name: Existing E2EE protocol + Alpha.2 projection adapter
        working-directory: spikes/e2ee-sync
        run: npm test

      - name: Web companion projection tests
        working-directory: product/labs/web-dashboard
        run: |
          npm test
          npm run validate

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Materialize Android scaffold
        working-directory: spikes/mobile-shell
        run: |
          flutter create --platforms=android --android-language=kotlin --project-name=financesensor_mobile_shell --org=com.financesensor.lab .
          python3 ../../tools/materialize-alpha2-android.py

      - name: Verify native compile surface
        working-directory: spikes/mobile-shell
        run: |
          set -euo pipefail
          grep -R -E -q 'compileSdk(Version)?\s*[= ]\s*37' android/app/build.gradle*
          grep -R -E -q 'minSdk(Version)?\s*[= ]\s*31' android/app/build.gradle*
          grep -R -E -q 'targetSdk(Version)?\s*[= ]\s*36' android/app/build.gradle*
          grep -R -q 'com.financesensor.lab.gmailconnection.r2' android/app/build.gradle*
          grep -R -q 'play-services-auth:21.6.0' android/app/build.gradle*
          grep -R -q 'sqlcipher-android:4.18.0' android/app/build.gradle*
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'https://www.googleapis.com/auth/gmail.readonly' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt
          ! grep -R -q 'requestOfflineAccess' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell
          ! grep -R -q 'serverAuthCode' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell

      - name: Resolve Flutter dependencies
        working-directory: spikes/mobile-shell
        run: flutter pub get

      - name: Flutter analyze
        working-directory: spikes/mobile-shell
        run: flutter analyze

      - name: Dart contracts + parser regressions + replay
        working-directory: spikes/mobile-shell
        run: flutter test

      - name: Build integrated Android APK internally
        working-directory: spikes/mobile-shell
        run: |
          flutter build apk --debug \
            --target lib/main_alpha2.dart \
            --build-name 0.2.0-alpha.2 \
            --build-number 2014

      - name: Verify APK parser and signature surface
        working-directory: spikes/mobile-shell
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-debug.apk'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='com.financesensor.lab.gmailconnection.r2'" <<< "$BADGING"
          grep -q "versionCode='2014'" <<< "$BADGING"
          grep -q "minSdkVersion:'31'" <<< "$BADGING"
          grep -q "targetSdkVersion:'36'" <<< "$BADGING"
          echo 'APK_SIGNATURE_VERIFY=PASS'
          echo 'APK_AAPT2_PARSE=PASS'

      - name: Freeze internal compile evidence
        working-directory: spikes/mobile-shell
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-debug.apk'
          SOURCE_SHA="$(git rev-parse HEAD)"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_BYTES="$(stat -c '%s' "$APK")"
          cat > alpha2-integrated-ci-evidence.txt <<EOF
          ALPHA2_INTEGRATED_RUNTIME_CI=PASS
          CANDIDATE_ID=0.2.0-alpha.2+2014
          PREDECESSOR_INTERNAL_CANDIDATE=0.2.0-alpha.2+2013
          PREDECESSOR_CANONICAL=0.2.0-alpha.2+2013
          PREDECESSOR_PHYSICAL_RESULT=OBSERVED_STRICT_EECC_REVIEW_0_IMPORTED_11_REVIEWED
          SOURCE_COMMIT=${SOURCE_SHA}
          ANDROID_OAUTH_PACKAGE=com.financesensor.lab.gmailconnection.r2
          EXACT_SCOPE=gmail.readonly
          ANDROID_COMPILE_SDK=37
          ANDROID_MIN_SDK=31
          ANDROID_TARGET_SDK=36
          SQLCIPHER_VERSION=4.18.0
          BCP_SAVINGS_COMPLETENESS_VERSION=A2_BCP_SAVINGS_COMPLETENESS_V2
          RIPLEY_CREDIT_STRICT_ADAPTER=A2_RIPLEY_CREDIT_STRICT_V1
          BCP_CREDIT_MODE=STRUCTURAL_PROBE_ONLY
          BCP_CREDIT_FINANCIAL_EVIDENCE_EMISSION=NO
          EXACT_FETCH_ENABLED_PROFILES=3
          INTERBANK_GMAIL_IDENTITY=OPEN_NOT_INVENTED
          SCAN_RESILIENCE=A2_SCAN_RESILIENCE_V1
          TRANSACTION_STATEMENT_SCAN_ISOLATION=YES
          TRANSIENT_SCAN_RETRY_BOUNDED=YES
          REAUTH_FAIL_CLOSED=YES
          PARTIAL_SAFE_SOURCE_CONTINUATION=YES
          RAW_GMAIL_RETURNED=NO
          ATTACHMENT_BYTES_FETCHED_DURING_DISCOVERY=NO
          NUMERIC_CONFIDENCE_RETURNED=NO
          STRICT_REVIEW_DIAGNOSTICS=A2_STRICT_REVIEW_DIAGNOSTICS_V1
          STRICT_REVIEW_PRIMARY_CAUSE_PER_STATEMENT=YES
          STRICT_REVIEW_PROFILE_ALLOWLIST=YES
          STRICT_REVIEW_CODE_ALLOWLIST=YES
          STRICT_REVIEW_UNKNOWN_COLLAPSE=STATEMENT_STRICT_REVIEW_OTHER
          STRICT_REVIEW_ARBITRARY_DETAIL_EXPOSURE=NO
          BCP_FRAGMENTED_HEADER_RECONSTRUCTION=YES
          CERTIFIED_BCP_SUMMARY_ROWS_ARE_NOT_MOVEMENTS=YES
          UNKNOWN_UNDATED_MONETARY_ROW_FAILS_CLOSED=YES
          PROFILE_KEY_SESSION_REUSE=YES
          PROFILE_KEY_DISK_PERSISTENCE=NO
          DNI_DERIVATION_OR_STORAGE=NO
          POST_PASSWORD_SAFE_STOP_DIAGNOSTICS=YES
          POST_PASSWORD_IMPORT_ISOLATION=YES
          STATEMENT_FAILURE_BLOCKS_SAFE_PROJECTION=NO
          APK_SIGNATURE_VERIFY=PASS
          APK_AAPT2_PARSE=PASS
          INTERNAL_APK_SHA256=${APK_SHA256}
          INTERNAL_APK_BYTES=${APK_BYTES}
          PUBLIC_CI_SIGNER=EPHEMERAL_DEBUG
          TRUSTED_EDGE_RESIGN_REQUIRED=YES
          CANONICAL_PROMOTION_PENDING=YES
          R1_TRUSTED_EDGE_RESIGN_REQUIRED=YES
          PREDECESSOR_PHYSICAL_EVIDENCE_INHERITANCE=NO
          REAL_OAUTH_EXECUTED_BY_CI=NO
          REAL_GMAIL_EXECUTED_BY_CI=NO
          REAL_FINANCIAL_DATA_IN_CI=NO
          PHYSICAL_SQLCIPHER_PASS=NO
          PHYSICAL_ALPHA2_PASS=NO
          BUILD_READY=NO
          RELEASE_READY=NO
          EOF
          cat alpha2-integrated-ci-evidence.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload internal compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: financesensor-alpha2-2014-candidate-${{ github.run_id }}
          path: |
            spikes/mobile-shell/build/app/outputs/flutter-apk/app-debug.apk
            spikes/mobile-shell/alpha2-integrated-ci-evidence.txt
          if-no-files-found: error
          retention-days: 7
