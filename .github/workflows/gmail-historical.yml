name: FinanceSensor Gmail Historical

on:
  pull_request:
    branches:
      - jett/mk0-foundation
    paths:
      - 'spikes/physical-ingress/**'
      - 'spikes/canonical-resolver/**'
      - 'spikes/mobile-shell/README.md'
      - 'graph/gmail-historical-onboarding.json'
      - 'graph/financial-source-coverage.json'
      - 'graph/q003-evidence.json'
      - 'tools/validate-gmail-historical-onboarding.mjs'
      - 'tools/validate-financial-source-coverage.mjs'
      - 'tools/validate-q003-evidence.mjs'
      - 'mk0/11-decisions/ADR-009-MOBILE-IMPLEMENTATION-STACK.md'
      - 'mk0/11-decisions/ADR-031-GMAIL-HISTORICAL-ONBOARDING-COVERAGE.md'
      - 'mk0/11-decisions/ADR-032-WINDOWS-LOCAL-GMAIL-HISTORY-VIEWER.md'
      - 'mk0/11-decisions/ADR-033-FINANCIAL-SOURCE-COVERAGE-ASYMMETRY.md'
      - '.github/workflows/gmail-historical.yml'
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - 'spikes/physical-ingress/**'
      - 'spikes/canonical-resolver/**'
      - 'spikes/mobile-shell/README.md'
      - 'graph/gmail-historical-onboarding.json'
      - 'graph/financial-source-coverage.json'
      - 'graph/q003-evidence.json'
      - 'tools/validate-gmail-historical-onboarding.mjs'
      - 'tools/validate-financial-source-coverage.mjs'
      - 'tools/validate-q003-evidence.mjs'
      - 'mk0/11-decisions/ADR-009-MOBILE-IMPLEMENTATION-STACK.md'
      - 'mk0/11-decisions/ADR-031-GMAIL-HISTORICAL-ONBOARDING-COVERAGE.md'
      - 'mk0/11-decisions/ADR-032-WINDOWS-LOCAL-GMAIL-HISTORY-VIEWER.md'
      - 'mk0/11-decisions/ADR-033-FINANCIAL-SOURCE-COVERAGE-ASYMMETRY.md'
      - '.github/workflows/gmail-historical.yml'

permissions:
  contents: read

concurrency:
  group: financesensor-gmail-historical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked minimal PDF runtime
        working-directory: spikes/physical-ingress
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Viewer syntax guard
        run: |
          node --check spikes/physical-ingress/live/owned-oauth-gmail-history-viewer.mjs
          node --check spikes/physical-ingress/live/owned-oauth-bank-statements-viewer.mjs
          node --check spikes/physical-ingress/live/audit-web-summary-preload.mjs
          node --check spikes/physical-ingress/src/file-encrypted-vault.js
          node --check spikes/physical-ingress/src/pdfjs-statement-parser.js
          node --check spikes/physical-ingress/src/statement-source-adapters.js
          node --check spikes/physical-ingress/src/statement-import-session.js
          node --check spikes/physical-ingress/src/statement-row-parser.js
          node --check spikes/physical-ingress/src/statement-evidence-importer.js
          node --check tools/validate-gmail-historical-onboarding.mjs
          node --check tools/validate-financial-source-coverage.mjs
          node --check tools/validate-q003-evidence.mjs

      - name: Audit preload import boundary
        working-directory: spikes/physical-ingress
        run: node --import ./live/audit-web-summary-preload.mjs -e "console.log('FINANCESENSOR_AUDIT_PRELOAD_IMPORT=PASS')"

      - name: PDF.js runtime boundary
        working-directory: spikes/physical-ingress
        run: node -e "import('pdfjs-dist/legacy/build/pdf.mjs').then(m=>{if(typeof m.getDocument!=='function')process.exit(2);console.log('PDFJS_GET_DOCUMENT=PASS')})"

      - name: Physical ingress regression
        working-directory: spikes/physical-ingress
        run: npm test

      - name: Canonical resolver regression
        working-directory: spikes/canonical-resolver
        run: npm test

      - name: Historical onboarding contract
        run: node tools/validate-gmail-historical-onboarding.mjs

      - name: Financial source coverage contract
        run: node tools/validate-financial-source-coverage.mjs

      - name: Q-003 evidence boundary
        run: node tools/validate-q003-evidence.mjs

      - name: Public CI trust boundary
        run: node tools/validate-ci-runner-policy.mjs

      - name: No real Gmail or credential material in test path
        run: |
          test -f spikes/physical-ingress/live/RUN-FINANCESENSOR-GMAIL-HISTORY.cmd
          test -f spikes/physical-ingress/live/RUN-FINANCESENSOR-BANK-STATEMENTS.cmd
          test -f mk0/11-decisions/ADR-032-WINDOWS-LOCAL-GMAIL-HISTORY-VIEWER.md
          test -f mk0/11-decisions/ADR-033-FINANCIAL-SOURCE-COVERAGE-ASYMMETRY.md
          ! grep -R -E -n --exclude-dir=.git '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' spikes/physical-ingress graph/gmail-historical-onboarding.json graph/financial-source-coverage.json mk0/11-decisions/ADR-009-MOBILE-IMPLEMENTATION-STACK.md mk0/11-decisions/ADR-031-GMAIL-HISTORICAL-ONBOARDING-COVERAGE.md mk0/11-decisions/ADR-032-WINDOWS-LOCAL-GMAIL-HISTORY-VIEWER.md mk0/11-decisions/ADR-033-FINANCIAL-SOURCE-COVERAGE-ASYMMETRY.md tools/validate-gmail-historical-onboarding.mjs tools/validate-financial-source-coverage.mjs

      - name: PR iOS no-touch guard
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^spikes/mobile-shell/native/ios/|^.*ios.*$'; then
            echo 'Historical Gmail PR unexpectedly touches iOS.' >&2
            exit 1
          fi

      - name: Summary
        run: |
          echo 'FINANCESENSOR_GMAIL_HISTORICAL_CI=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'FINANCESENSOR_FINANCIAL_SOURCE_COVERAGE=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCT_SURFACE=FLUTTER_MOBILE_APP' >> "$GITHUB_STEP_SUMMARY"
          echo 'WINDOWS_STATEMENT_RUNNER=MK0_EVIDENCE_HARNESS_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic/static only. No real Gmail OAuth, statement password, mailbox data or financial plaintext enter GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_HISTORICAL_GMAIL_COVERAGE remains physically OPEN until nextPageToken exhaustion.' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_STATEMENT_PARSE remains physically OPEN.' >> "$GITHUB_STEP_SUMMARY"
          echo 'MOBILE_STATEMENT_PHYSICAL_PASS remains OPEN and cannot be promoted by a desktop harness.' >> "$GITHUB_STEP_SUMMARY"
