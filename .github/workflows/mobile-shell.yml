name: FinanceSensor Mobile Shell

on:
  workflow_dispatch:
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - 'spikes/mobile-shell/**'
      - 'tools/validate-mobile-shell.mjs'
      - 'tools/validate-mobile-stack.mjs'
      - 'tools/validate-implementation-baseline.mjs'
      - 'mk0/11-decisions/ADR-006-LOCAL-PERSISTENCE-ENCRYPTION.md'
      - 'mk0/11-decisions/ADR-009-MOBILE-IMPLEMENTATION-STACK.md'
      - 'mk0/11-decisions/ADR-013-MINIMUM-SUPPORTED-ANDROID-BASELINE.md'
      - '.github/workflows/mobile-shell.yml'

permissions:
  contents: read

concurrency:
  group: financesensor-mobile-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Flutter toolchain evidence
        run: |
          flutter --version
          flutter doctor -v

      - name: Static synthetic + implementation boundaries
        run: |
          node tools/validate-mobile-shell.mjs
          node tools/validate-mobile-stack.mjs
          node tools/validate-implementation-baseline.mjs

      - name: Materialize Android Kotlin scaffold
        working-directory: spikes/mobile-shell
        run: |
          flutter create \
            --platforms=android \
            --android-language=kotlin \
            --project-name=financesensor_mobile_shell \
            --org=com.financesensor.lab \
            .

      - name: Apply FinanceSensor Android baseline
        working-directory: spikes/mobile-shell
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')

          if kts.exists():
              text = kts.read_text()
              old_min = 'minSdk = flutter.minSdkVersion'
              old_target = 'targetSdk = flutter.targetSdkVersion'
              if old_min not in text:
                  raise SystemExit('EXPECTED_FLUTTER_MINSDK_MARKER_NOT_FOUND')
              if old_target not in text:
                  raise SystemExit('EXPECTED_FLUTTER_TARGETSDK_MARKER_NOT_FOUND')
              text = text.replace(old_min, 'minSdk = 31')
              text = text.replace(old_target, 'targetSdk = 36')
              kts.write_text(text)
              print('ANDROID_GRADLE_DIALECT=KOTLIN_DSL')
          elif groovy.exists():
              text = groovy.read_text()
              old_min = 'minSdkVersion flutter.minSdkVersion'
              old_target = 'targetSdkVersion flutter.targetSdkVersion'
              if old_min not in text:
                  raise SystemExit('EXPECTED_FLUTTER_MINSDK_MARKER_NOT_FOUND')
              if old_target not in text:
                  raise SystemExit('EXPECTED_FLUTTER_TARGETSDK_MARKER_NOT_FOUND')
              text = text.replace(old_min, 'minSdkVersion 31')
              text = text.replace(old_target, 'targetSdkVersion 36')
              groovy.write_text(text)
              print('ANDROID_GRADLE_DIALECT=GROOVY')
          else:
              raise SystemExit('ANDROID_APP_GRADLE_FILE_NOT_FOUND')
          PY

      - name: Verify Android baseline
        working-directory: spikes/mobile-shell
        run: |
          test -f android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt
          grep -R -E -q 'minSdk(Version)?\s*[= ]\s*31' android/app/build.gradle* 
          grep -R -E -q 'targetSdk(Version)?\s*[= ]\s*36' android/app/build.gradle*
          ! grep -R -E -q 'minSdk(Version)?\s*[= ]\s*(2[0-9]|30)\b' android/app/build.gradle*
          echo 'ANDROID_LANGUAGE=KOTLIN'
          echo 'ANDROID_MIN_SDK=31'
          echo 'ANDROID_TARGET_SDK=36'

      - name: Resolve dependencies
        working-directory: spikes/mobile-shell
        run: flutter pub get

      - name: Analyze
        working-directory: spikes/mobile-shell
        run: flutter analyze

      - name: Widget tests
        working-directory: spikes/mobile-shell
        run: flutter test

      - name: Build Android debug APK
        working-directory: spikes/mobile-shell
        run: flutter build apk --debug

      - name: APK evidence
        working-directory: spikes/mobile-shell
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256
          stat -c 'APK_BYTES=%s' build/app/outputs/flutter-apk/app-debug.apk
          echo 'FINANCESENSOR_MOBILE_SHELL_APK=DEBUG_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'ANDROID_MIN_SDK=31' >> "$GITHUB_STEP_SUMMARY"
          echo 'ANDROID_TARGET_SDK=36' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_GMAIL=0' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_OAUTH=0' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_FINANCIAL_DATA=0' >> "$GITHUB_STEP_SUMMARY"
          echo 'BUILD_READY=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: financesensor-mobile-shell-android-debug
          path: |
            spikes/mobile-shell/build/app/outputs/flutter-apk/app-debug.apk
            spikes/mobile-shell/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
