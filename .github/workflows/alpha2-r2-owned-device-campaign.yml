name: Alpha.2 R2 Owned-Device Campaign Contract
on:
  workflow_dispatch:
  pull_request:
    branches: [jett/mk0-foundation]
    paths: ['graph/alpha2-r2-owned-device-campaign.json','graph/alpha2-2015-r1-signing-handoff.json','graph/alpha2-canonical-candidate.json','graph/alpha2-human-intervention-gate.json','graph/alpha2-2015-refreeze-candidate.json','tools/validate-alpha2-r2-owned-device-campaign.mjs','tools/validate-alpha2-r2-chain.mjs','tools/validate-ci-runner-policy.mjs','.github/workflows/alpha2-r2-owned-device-campaign.yml']
  push:
    branches: [jett/mk0-foundation]
    paths: ['graph/alpha2-r2-owned-device-campaign.json','graph/alpha2-2015-r1-signing-handoff.json','graph/alpha2-canonical-candidate.json','graph/alpha2-human-intervention-gate.json','graph/alpha2-2015-refreeze-candidate.json','tools/validate-alpha2-r2-owned-device-campaign.mjs','tools/validate-alpha2-r2-chain.mjs','tools/validate-ci-runner-policy.mjs','.github/workflows/alpha2-r2-owned-device-campaign.yml']
permissions: {contents: read}
jobs:
  validate-r2-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/validate-alpha2-human-intervention-gate.mjs
      - run: node tools/validate-alpha2-2015-canonical-candidate.mjs
      - run: node tools/validate-alpha2-r2-owned-device-campaign.mjs
      - run: node tools/validate-alpha2-r2-chain.mjs
      - run: node tools/validate-ci-runner-policy.mjs
      - name: Preserve signed physical frontier
        run: |
          echo 'CANDIDATE=0.2.0-alpha.2+2015'
          echo 'SIGNED_APK_SHA256=076aa4328165e2e327d11e4cd4dc2d8a4b3ae1aff6b2b871e112910aeadd159e'
          echo 'R1_TRUSTED_EDGE_SIGNING=PASS'
          echo 'R2_PHYSICAL_CAMPAIGN=READY_FOR_OD0'
          echo 'OD0_EXECUTION_ALLOWED=YES'
          echo 'OWNED_DEVICE_UAT_REQUEST_ALLOWED=YES'
          echo 'PHYSICAL_ALPHA2_PASS=NO'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
