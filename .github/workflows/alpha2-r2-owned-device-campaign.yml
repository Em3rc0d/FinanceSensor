name: Alpha.2 R2 Owned-Device Campaign Contract
on:
  workflow_dispatch:
  pull_request:
    branches: [jett/mk0-foundation]
    paths: ['graph/alpha2-r2-owned-device-campaign.json','graph/alpha2-r1-signing-handoff.json','graph/alpha2-canonical-candidate.json','graph/alpha2-human-intervention-gate.json','graph/physical-receipts/ALPHA2-R1-TRUSTED-EDGE-SIGNING-2012-2026-09-15.json','tools/validate-alpha2-r2-owned-device-campaign.mjs','tools/validate-alpha2-r2-chain.mjs','tools/validate-prebuild-remainder-design.mjs','tools/validate-ci-runner-policy.mjs','.github/workflows/alpha2-r2-owned-device-campaign.yml']
  push:
    branches: [jett/mk0-foundation]
    paths: ['graph/alpha2-r2-owned-device-campaign.json','graph/alpha2-r1-signing-handoff.json','graph/alpha2-canonical-candidate.json','graph/alpha2-human-intervention-gate.json','graph/physical-receipts/ALPHA2-R1-TRUSTED-EDGE-SIGNING-2012-2026-09-15.json','tools/validate-alpha2-r2-owned-device-campaign.mjs','tools/validate-alpha2-r2-chain.mjs','tools/validate-prebuild-remainder-design.mjs','tools/validate-ci-runner-policy.mjs','.github/workflows/alpha2-r2-owned-device-campaign.yml']
permissions: {contents: read}
jobs:
  validate-r2-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/validate-alpha2-human-intervention-gate.mjs
      - run: node tools/validate-alpha2-r1-signing-handoff.mjs
      - run: node tools/validate-alpha2-r2-owned-device-campaign.mjs
      - run: node tools/validate-alpha2-r2-chain.mjs
      - run: node tools/validate-prebuild-remainder-design.mjs
      - run: node tools/validate-ci-runner-policy.mjs
      - name: Preserve signed physical frontier
        run: |
          echo 'CANDIDATE=0.2.0-alpha.2+2012'
          echo 'SIGNING_REQUEST_ALLOWED=NO'
          echo 'R1_TRUSTED_EDGE_SIGNING=PASS'
          echo 'PUBLIC_CI_ORIGINATED_PHYSICAL_PASS=0'
          echo 'R2_PHYSICAL_CAMPAIGN=READY_FOR_OD0'
          echo 'OWNED_DEVICE_UAT_REQUEST_ALLOWED=YES'
          echo 'CURRENT_OD0_OD11_PASS=NONE'
          echo 'ALPHA2_2009_R2_EVIDENCE=HISTORICAL_NON_INHERITABLE'
          echo 'R2_NEXT_GATE=OD0_SIGNED_APK_INSTALL_AND_LAUNCH'
          echo 'R2_CURRENT_BLOCKER=OWNED_DEVICE_OD0_EXECUTION_REQUIRED'
          echo 'REAL_OAUTH_IN_CI=0'
          echo 'REAL_GMAIL_IN_CI=0'
          echo 'REAL_FINANCIAL_DATA_IN_CI=0'
          echo 'PRIVATE_SIGNING_MATERIAL_IN_CI=0'
          echo 'PHYSICAL_ALPHA2_PASS=NO'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
