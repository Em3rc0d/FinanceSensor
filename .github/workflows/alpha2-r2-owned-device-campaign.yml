name: Alpha.2 R2 Owned-Device Campaign Contract

on:
  workflow_dispatch:
  pull_request:
    branches:
      - jett/mk0-foundation
    paths:
      - 'graph/alpha2-r2-owned-device-campaign.json'
      - 'graph/alpha2-r2-sanitized-receipt-schema.json'
      - 'graph/prebuild-remainder-design.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/physical-closure-campaign.json'
      - 'tools/validate-alpha2-r2-owned-device-campaign.mjs'
      - 'tools/validate-alpha2-r2-chain.mjs'
      - 'tools/reduce-alpha2-r1-signing-receipt.mjs'
      - 'tools/validate-build-readiness.mjs'
      - 'tools/validate-prebuild-remainder-design.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'mk0/07-plan/ALPHA2-R2-OWNED-DEVICE-CAMPAIGN.md'
      - 'mk0/10-evidence/EV-ALPHA2-R2-CAMPAIGN-DESIGN-FREEZE-2026-09-07.md'
      - '.github/workflows/alpha2-r2-owned-device-campaign.yml'
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - 'graph/alpha2-r2-owned-device-campaign.json'
      - 'graph/alpha2-r2-sanitized-receipt-schema.json'
      - 'graph/prebuild-remainder-design.json'
      - 'graph/alpha2-r1-signing-handoff.json'
      - 'graph/alpha2-canonical-candidate.json'
      - 'graph/physical-closure-campaign.json'
      - 'tools/validate-alpha2-r2-owned-device-campaign.mjs'
      - 'tools/validate-alpha2-r2-chain.mjs'
      - 'tools/reduce-alpha2-r1-signing-receipt.mjs'
      - 'tools/validate-build-readiness.mjs'
      - 'tools/validate-prebuild-remainder-design.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'mk0/07-plan/ALPHA2-R2-OWNED-DEVICE-CAMPAIGN.md'
      - 'mk0/10-evidence/EV-ALPHA2-R2-CAMPAIGN-DESIGN-FREEZE-2026-09-07.md'
      - '.github/workflows/alpha2-r2-owned-device-campaign.yml'

permissions:
  contents: read

concurrency:
  group: financesensor-alpha2-r2-campaign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-r2-campaign-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: R2 owned-device campaign reopened contract
        run: node tools/validate-alpha2-r2-owned-device-campaign.mjs

      - name: R2 prebuild blockchain chain
        run: node tools/validate-alpha2-r2-chain.mjs

      - name: Future R1 +2005 signing receipt reducer regression
        run: |
          set -euo pipefail
          cat > /tmp/alpha2-r1-2005-synthetic-receipt.txt <<'EOF'
          FINANCESENSOR_ALPHA2_R2_TRUSTED_EDGE_SIGNING=PASS
          FINANCESENSOR_ALPHA2_CANDIDATE=0.2.0-alpha.2+2005
          SOURCE_COMMIT=d99e7e4765adfc96bed9d914b2b6f296f9712242
          CANONICAL_RUN_ID=34257413733
          CANONICAL_ARTIFACT_ID=10068684066
          INPUT_APK_SHA256=dacc7d7281842989904adfc1d3e7b17242b39b20674eb8e7c33e1e339428a44c
          INPUT_APK_BYTES=182092699
          SIGNED_APK_SHA256=1111111111111111111111111111111111111111111111111111111111111111
          SIGNED_APK_BYTES=182120000
          SIGNER_SHA1=63:2F:3A:4C:AE:C6:86:5B:C4:02:E8:82:12:2E:33:38:A6:EF:EB:D0
          ANDROID_OAUTH_PACKAGE=com.financesensor.lab.gmailconnection.r2
          EXACT_SCOPE=gmail.readonly
          PRIVATE_SIGNING_MATERIAL_IN_GITHUB=0
          REAL_OAUTH_EXECUTED_BY_SIGNING_STEP=0
          REAL_GMAIL_EXECUTED_BY_SIGNING_STEP=0
          ALPHA2_MOBILE_INTEGRATION_CI=PASS
          ALPHA2_MOBILE_INTEGRATION_PHYSICAL=OPEN
          PHYSICAL_SQLCIPHER_PASS=NO
          PHYSICAL_ALPHA2_PASS=NO
          BUILD_READY=NO
          RELEASE_READY=NO
          EOF
          node tools/reduce-alpha2-r1-signing-receipt.mjs /tmp/alpha2-r1-2005-synthetic-receipt.txt > /tmp/alpha2-r1-2005-reduced.txt
          grep -q 'ALPHA2_R1_SIGNING_RECEIPT_REDUCER=PASS' /tmp/alpha2-r1-2005-reduced.txt
          grep -q '"candidate": "0.2.0-alpha.2+2005"' /tmp/alpha2-r1-2005-reduced.txt
          grep -q '"r2OwnedDeviceCampaignUnblocked": true' /tmp/alpha2-r1-2005-reduced.txt
          grep -q '"physicalAlpha2Pass": false' /tmp/alpha2-r1-2005-reduced.txt
          grep -q '"buildReady": false' /tmp/alpha2-r1-2005-reduced.txt

      - name: CI runner governance
        run: node tools/validate-ci-runner-policy.mjs

      - name: Preserve pre-R1 physical boundary
        run: |
          set -euo pipefail
          echo 'R1_TRUSTED_EDGE_SIGNING=OPEN'
          echo 'PUBLIC_CI_ORIGINATED_PHYSICAL_PASS=0'
          echo 'R2_PHYSICAL_CAMPAIGN=BLOCKED_BY_R1'
          echo 'R2_NEXT_GATE=BLOCKED_UNTIL_R1_PASS'
          echo 'REAL_OAUTH_IN_CI=0'
          echo 'REAL_GMAIL_IN_CI=0'
          echo 'REAL_FINANCIAL_DATA_IN_CI=0'
          echo 'PRIVATE_SIGNING_MATERIAL_IN_CI=0'
          echo 'PHYSICAL_ALPHA2_PASS=NO'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
