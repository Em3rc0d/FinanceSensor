name: FinanceSensor Heartbeat

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - jett/mk0-foundation
    paths:
      - 'STATUS.md'
      - 'spikes/canonical-resolver/**'
      - 'spikes/e2ee-sync/**'
      - 'spikes/physical-ingress/**'
      - 'spikes/mobile-shell/**'
      - '.github/workflows/**'
      - 'ops/**'
      - 'graph/**'
      - 'tools/**'
      - 'product/**'
      - 'mk0/**'
      - 'research/**'
      - '.gitignore'
      - 'SECURITY.md'

permissions:
  contents: read

concurrency:
  group: financesensor-heartbeat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vital-signs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Canonical resolver ECG
        working-directory: spikes/canonical-resolver
        run: npm test

      - name: Peripheral + parasympathetic + recovery ECG
        working-directory: spikes/e2ee-sync
        run: npm test

      - name: Physical ingress + privacy ECG
        working-directory: spikes/physical-ingress
        run: npm test

      - name: Level C v8 static safety ECG
        run: |
          node --check spikes/physical-ingress/live/owned-oauth-level-c-v8.mjs
          node tools/validate-level-c-v8.mjs

      - name: Physical campaign contract ECG
        run: |
          node --check tools/physical-evidence-sanitizer.mjs
          node tools/validate-physical-evidence-sanitizer.mjs
          node tools/validate-physical-campaign.mjs
          node --check tools/build-p1-sanitized-receipt.mjs
          node tools/validate-p1-sanitized-receipt.mjs

      - name: Mobile product + stack ECG
        run: |
          node tools/validate-mobile-product-lab.mjs
          node tools/validate-mobile-stack.mjs
          node tools/validate-mobile-shell.mjs

      - name: Implementation baseline ECG
        run: node tools/validate-implementation-baseline.mjs

      - name: Build readiness ECG
        run: node tools/validate-build-readiness.mjs

      - name: Closure graph ECG
        run: node tools/validate-closure-graph.mjs

      - name: Artifact status authority ECG
        run: node tools/validate-artifact-status.mjs

      - name: Quarry status ECG
        run: node tools/validate-quarry-status.mjs

      - name: Invariant nervous system ECG
        run: node tools/validate-traceability.mjs

      - name: Privacy boundary ECG
        run: node tools/validate-privacy-matrix.mjs

      - name: Public CI routing boundary ECG
        run: node tools/validate-ci-runner-policy.mjs

      - name: Gmail production policy ECG
        run: node tools/validate-gmail-production-policy.mjs

      - name: Public exposure guard
        run: |
          test -f .gitignore
          test -f SECURITY.md
          grep -q '^\.env$' .gitignore
          grep -q '^\*credentials\*\.json$' .gitignore
          grep -q '^client_secret\*\.json$' .gitignore
          grep -q '^\*\.pem$' .gitignore
          grep -q '^financesensor-level-c-result\.json$' .gitignore
          ! grep -R -E -n --exclude-dir=.git --exclude='*.md' --exclude='.gitignore' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .

      - name: Guard recovery equipment
        run: |
          test -f STATUS.md
          test -f ops/VITALS.md
          test -f ops/RECOVERY-PLAYBOOK.md
          test -f ops/SELF-HOSTED-RUNNER.md
          test -f graph/GRAPH-PROTOCOL.md
          test -f graph/NERVOUS-SYSTEM.md
          test -f graph/STATUS-AUTHORITY.md
          test -f graph/traceability-matrix.json
          test -f graph/traceability-recovery.json
          test -f graph/physical-closure-campaign.json
          test -f graph/build-readiness.json
          test -f graph/CLOSURE-RECEIPT-TEMPLATE.md
          test -f mk0/04-architecture/PRIVACY-DATA-MATRIX.json
          test -f mk0/04-architecture/PRIVACY-RECOVERY-MATRIX.json
          test -f mk0/04-architecture/PERIPHERAL-NERVOUS-SYSTEM.md
          test -f mk0/04-architecture/PARASYMPATHETIC-SYNC.md
          test -f mk0/04-architecture/THREAT-MODEL.md
          test -f mk0/06-wireframes/SIGNATURE-UX-FREEZE.md
          test -f mk0/06-wireframes/NO-SCROLL-BUILD-ENTRY.md
          test -f mk0/11-decisions/ADR-006-LOCAL-PERSISTENCE-ENCRYPTION.md
          test -f mk0/11-decisions/ADR-009-MOBILE-IMPLEMENTATION-STACK.md
          test -f mk0/11-decisions/ADR-010-CONTROL-PLANE-RUNTIME-CLOUD.md
          test -f mk0/11-decisions/ADR-013-MINIMUM-SUPPORTED-ANDROID-BASELINE.md
          test -f mk0/11-decisions/ADR-014-RECOVERY-WITHOUT-SERVER-MASTER-KEY.md
          test -f mk0/11-decisions/ADR-020-GMAIL-RESTRICTED-DATA-SERVER-BOUNDARY.md
          test -f mk0/11-decisions/ADR-025-MOBILE-FIRST-PRODUCT-SURFACE.md
          test -f mk0/07-plan/GMAIL-PRODUCTION-VERIFICATION-PACKAGE.md
          test -f mk0/07-plan/Q003-Q004-Q005-PHYSICAL-CLOSURE-CAMPAIGN.md
          test -f mk0/07-plan/BUILD-ENTRY-CLOSURE-PLAN.md
          test -f mk0/07-plan/IMPLEMENTATION-SLICES.md
          test -f product/MK0-SCOPE-FREEZE.md
          test ! -f mk0/11-decisions/ADR-005-RECOVERY-WITHOUT-SERVER-MASTER-KEY.md
          test -f product/labs/mobile-bi/README.md
          test -f product/labs/mobile-bi/index.html
          test -f spikes/mobile-shell/README.md
          test -f spikes/mobile-shell/pubspec.yaml
          test -f spikes/mobile-shell/lib/main.dart
          test -f spikes/mobile-shell/test/widget_test.dart
          test -f .github/workflows/mobile-shell.yml
          test -f spikes/e2ee-sync/src/recovery.js
          test -f spikes/e2ee-sync/test/recovery.test.js
          test -f spikes/physical-ingress/README.md
          test -f spikes/physical-ingress/live/owned-oauth-level-c-v8.mjs
          test -f tools/validate-level-c-v8.mjs
          test -f tools/physical-evidence-sanitizer.mjs
          test -f tools/validate-physical-evidence-sanitizer.mjs
          test -f tools/validate-physical-campaign.mjs
          test -f tools/build-p1-sanitized-receipt.mjs
          test -f tools/validate-p1-sanitized-receipt.mjs
          test -f tools/validate-mobile-product-lab.mjs
          test -f tools/validate-mobile-stack.mjs
          test -f tools/validate-mobile-shell.mjs
          test -f tools/validate-implementation-baseline.mjs
          test -f tools/validate-build-readiness.mjs
          test -f tools/validate-ci-runner-policy.mjs
          test -f tools/validate-gmail-production-policy.mjs
          grep -q 'BUILD_READY                NO' STATUS.md
          grep -q 'FINANCIAL_TRUTH' ops/VITALS.md
          grep -q 'SELF_HOSTED_CI != FINANCESENSOR_TRUSTED_EDGE' ops/SELF-HOSTED-RUNNER.md
          grep -q 'DO NOT MERGE' ops/RECOVERY-PLAYBOOK.md
          grep -q 'BUILD_READY = YES' graph/GRAPH-PROTOCOL.md
          grep -q 'PRODUCT INVARIANT' graph/NERVOUS-SYSTEM.md
          grep -q 'only authoritative source' graph/STATUS-AUTHORITY.md
          grep -q 'SQLCIPHER_FAILURE => FAIL_CLOSED' mk0/11-decisions/ADR-006-LOCAL-PERSISTENCE-ENCRYPTION.md
          grep -q 'FLUTTER_UI != SECURITY_BOUNDARY' mk0/11-decisions/ADR-009-MOBILE-IMPLEMENTATION-STACK.md
          grep -q 'SUPABASE_AUTH != GOOGLE_OAUTH_AUTHORITY' mk0/11-decisions/ADR-010-CONTROL-PLANE-RUNTIME-CLOUD.md
          grep -q 'ANDROID MIN SDK                  31' mk0/11-decisions/ADR-013-MINIMUM-SUPPORTED-ANDROID-BASELINE.md
          grep -q 'SERVER_MASTER_KEY' mk0/11-decisions/ADR-014-RECOVERY-WITHOUT-SERVER-MASTER-KEY.md
          grep -q 'PROVIDER DETERMINATION > SELF-DECLARED EXEMPTION' mk0/11-decisions/ADR-020-GMAIL-RESTRICTED-DATA-SERVER-BOUNDARY.md
          grep -q 'FINANCESENSOR PRIMARY PRODUCT = MOBILE APPLICATION' mk0/11-decisions/ADR-025-MOBILE-FIRST-PRODUCT-SURFACE.md
          grep -q 'BUILD_READY_TRUE_REQUIRES_G_MK0_CLOSED' graph/build-readiness.json
          grep -q 'UNRESTRICTED_BUILD = BLOCKED' mk0/07-plan/BUILD-ENTRY-CLOSURE-PLAN.md
          grep -q 'MOBILE_SHELL != PRODUCTION_APP' spikes/mobile-shell/README.md
          grep -q 'APK_BUILD_PASS != BUILD_READY' spikes/mobile-shell/README.md
          grep -q 'INV-SYNC-011' mk0/05-data-model/INVARIANTS.md
          ! grep -R -q 'ADR-005-RECOVERY-WITHOUT-SERVER-MASTER-KEY' STATUS.md graph mk0 product research spikes tools ops --exclude='ADR-005-RECOVERY-WITHOUT-SERVER-MASTER-KEY.md'

      - name: Heartbeat summary
        run: |
          echo 'FINANCESENSOR_HEARTBEAT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public CI executes on ephemeral GitHub-hosted infrastructure with contents:read only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real Gmail authorization, tokens and financial data remain LOCAL EDGE ONLY.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Implementation baseline and build-readiness contracts are machine-readable; BUILD_READY remains false until G-MK0 closes.' >> "$GITHUB_STEP_SUMMARY"

  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Flutter toolchain evidence
        run: flutter --version

      - name: Materialize Android Kotlin scaffold
        working-directory: spikes/mobile-shell
        run: |
          flutter create --platforms=android --android-language=kotlin --project-name=financesensor_mobile_shell --org=com.financesensor.lab .

      - name: Apply Android baseline
        working-directory: spikes/mobile-shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          if kts.exists():
              text = kts.read_text()
              text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 31')
              text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              kts.write_text(text)
          elif groovy.exists():
              text = groovy.read_text()
              text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 31')
              text = text.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 36')
              groovy.write_text(text)
          else:
              raise SystemExit('ANDROID_APP_GRADLE_FILE_NOT_FOUND')
          PY
          grep -R -E -q 'minSdk(Version)?\s*[= ]\s*31' android/app/build.gradle*
          grep -R -E -q 'targetSdk(Version)?\s*[= ]\s*36' android/app/build.gradle*

      - name: Resolve dependencies
        working-directory: spikes/mobile-shell
        run: flutter pub get

      - name: Analyze
        working-directory: spikes/mobile-shell
        run: flutter analyze

      - name: Widget viewport tests
        working-directory: spikes/mobile-shell
        run: flutter test

      - name: Build Android debug APK
        working-directory: spikes/mobile-shell
        run: flutter build apk --debug

      - name: APK evidence
        working-directory: spikes/mobile-shell
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app/outputs/flutter-apk/app-debug.apk.sha256
          stat -c 'APK_BYTES=%s' build/app/outputs/flutter-apk/app-debug.apk
          echo 'FINANCESENSOR_MOBILE_SHELL_APK=DEBUG_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_GMAIL=0' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_OAUTH=0' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_FINANCIAL_DATA=0' >> "$GITHUB_STEP_SUMMARY"
          echo 'BUILD_READY=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: financesensor-mobile-shell-android-debug
          path: |
            spikes/mobile-shell/build/app/outputs/flutter-apk/app-debug.apk
            spikes/mobile-shell/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
