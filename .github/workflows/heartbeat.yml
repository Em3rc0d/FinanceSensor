name: FinanceSensor Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches:
      - main
      - jett/mk0-foundation
    paths:
      - 'STATUS.md'
      - 'spikes/canonical-resolver/**'
      - '.github/workflows/heartbeat.yml'
      - 'ops/**'
      - 'graph/**'
      - 'tools/**'
      - 'product/**'
      - 'mk0/**'
      - 'research/**'

permissions:
  contents: read

concurrency:
  group: financesensor-heartbeat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vital-signs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Canonical resolver ECG
        working-directory: spikes/canonical-resolver
        run: npm test

      - name: Closure graph ECG
        run: node tools/validate-closure-graph.mjs

      - name: Quarry status ECG
        run: node tools/validate-quarry-status.mjs

      - name: Privacy boundary ECG
        run: node tools/validate-privacy-matrix.mjs

      - name: Guard recovery equipment
        run: |
          test -f STATUS.md
          test -f ops/VITALS.md
          test -f ops/RECOVERY-PLAYBOOK.md
          test -f graph/GRAPH-PROTOCOL.md
          test -f graph/CLOSURE-RECEIPT-TEMPLATE.md
          test -f mk0/04-architecture/PRIVACY-DATA-MATRIX.json
          grep -q 'BUILD_READY                NO' STATUS.md
          grep -q 'FINANCIAL_TRUTH' ops/VITALS.md
          grep -q 'DO NOT MERGE' ops/RECOVERY-PLAYBOOK.md
          grep -q 'BUILD_READY = YES' graph/GRAPH-PROTOCOL.md

      - name: Heartbeat summary
        run: |
          echo 'FINANCESENSOR_HEARTBEAT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical financial invariants are responding.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Closure graph is structurally consistent.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Quarry Markdown states match the closure ledger.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Privacy data-handling matrix is structurally consistent.' >> "$GITHUB_STEP_SUMMARY"
          echo 'STATUS still reflects the blocked BUILD_READY gate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Recovery equipment is present.' >> "$GITHUB_STEP_SUMMARY"
