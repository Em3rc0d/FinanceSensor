name: FinanceSensor statement lock one-shot

on:
  push:
    branches:
      - jett/split-inflow-outflow-coverage

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jett/split-inflow-outflow-coverage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact dependency lock
        working-directory: spikes/physical-ingress
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reconcile ADR index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mk0/11-decisions/ADR-INDEX.md')
          s = p.read_text()
          anchor = '| ADR-030 | Restore-domain-independent deletion barrier | ACCEPTED FOR PRODUCTION DESIGN / PHYSICAL P3 VALIDATION REQUIRED | provider backup/delete/restore campaign |'
          rows = '''| ADR-031 | Gmail historical onboarding coverage | ACCEPTED FOR PRODUCTION DESIGN / REAL HISTORICAL COMPLETE OPEN | owned-mailbox nextPageToken exhaustion |\n| ADR-032 | Windows local Gmail history viewer | ACCEPTED FOR DEV PHYSICAL HARNESS / REAL COVERAGE OPEN | owned Windows historical completion |\n| ADR-033 | Financial source coverage asymmetry and statement lane | ACCEPTED FOR MK0 DESIGN / STATEMENT PHYSICAL PARSE OPEN | encrypted statement local parse + reconciliation |'''
          if 'ADR-033 | Financial source coverage asymmetry' not in s:
              s = s.replace(anchor, anchor + '\n' + rows)
          import re
          s = re.sub(r'\*\*Next available ADR:\*\* `ADR-\d+`\.', '**Next available ADR:** `ADR-034`.', s)
          p.write_text(s)
          PY
      - name: Static checks
        run: |
          node tools/validate-financial-source-coverage.mjs
          cd spikes/physical-ingress
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node -e "import('pdfjs-dist/legacy/build/pdf.mjs').then(m=>{if(typeof m.getDocument!=='function')process.exit(2);console.log('PDFJS_GET_DOCUMENT=PASS')})"
      - name: Remove one-shot and commit generated artifacts
        run: |
          rm .github/workflows/statement-lock-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add spikes/physical-ingress/package-lock.json mk0/11-decisions/ADR-INDEX.md .github/workflows/statement-lock-one-shot.yml
          git commit -m "build(ingress): lock statement parser and reconcile ADR index"
          git push origin HEAD:jett/split-inflow-outflow-coverage
