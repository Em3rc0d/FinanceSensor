name: Alpha.2 Human Intervention Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - jett/mk0-foundation
    paths:
      - 'spikes/mobile-shell/lib/alpha2/**'
      - 'spikes/mobile-shell/lib/main_alpha2.dart'
      - 'spikes/mobile-shell/native/android/Alpha2*.kt'
      - 'spikes/mobile-shell/test/alpha2_*_test.dart'
      - 'graph/alpha2-human-intervention-gate.json'
      - 'graph/alpha2-canonical-candidate.json'
      - 'mk0/11-decisions/ADR-040-HUMAN-INTERVENTION-CERTIFICATION-ONLY.md'
      - 'mk0/11-decisions/ADR-INDEX.md'
      - 'tools/validate-alpha2-human-intervention-gate.mjs'
      - 'tools/validate-alpha2-integrated-runtime.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - '.github/workflows/alpha2-human-intervention-gate.yml'
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - 'spikes/mobile-shell/lib/alpha2/**'
      - 'spikes/mobile-shell/lib/main_alpha2.dart'
      - 'spikes/mobile-shell/native/android/Alpha2*.kt'
      - 'spikes/mobile-shell/test/alpha2_*_test.dart'
      - 'graph/alpha2-human-intervention-gate.json'
      - 'graph/alpha2-canonical-candidate.json'
      - 'mk0/11-decisions/ADR-040-HUMAN-INTERVENTION-CERTIFICATION-ONLY.md'
      - 'mk0/11-decisions/ADR-INDEX.md'
      - 'tools/validate-alpha2-human-intervention-gate.mjs'
      - 'tools/validate-alpha2-integrated-runtime.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - '.github/workflows/alpha2-human-intervention-gate.yml'

permissions:
  contents: read

concurrency:
  group: financesensor-alpha2-human-intervention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  human-intervention-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce certification-only human intervention
        run: node tools/validate-alpha2-human-intervention-gate.mjs

      - name: Enforce CI routing policy
        run: node tools/validate-ci-runner-policy.mjs

      - name: Freeze public-CI boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'HUMAN_DISCOVERY_TESTING=FORBIDDEN'
          echo 'SIGNING_REQUEST_ALLOWED=NO_UNTIL_EXPLICIT_GATE_PASS'
          echo 'OWNED_DEVICE_UAT_REQUEST_ALLOWED=NO_UNTIL_EXPLICIT_GATE_PASS'
          echo 'CANDIDATE_MUTATION_RESETS_ELIGIBILITY=YES'
          echo 'PRIOR_CANDIDATE_PHYSICAL_EVIDENCE_INHERITANCE=NO'
          echo 'SAME_CANDIDATE_RERUN=AMBIGUOUS_OR_ENVIRONMENTAL_ONLY'
          echo 'PUBLIC_CI_ORIGINATED_PHYSICAL_PASS=0'
          echo 'BUILD_READY=NO'
          echo 'RELEASE_READY=NO'
