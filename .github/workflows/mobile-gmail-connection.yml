name: FinanceSensor Android Gmail Connection

on:
  workflow_dispatch:
  push:
    branches:
      - jett/mk0-foundation
    paths:
      - 'spikes/mobile-shell/lib/main_connected.dart'
      - 'spikes/mobile-shell/native/android/**'
      - 'spikes/mobile-shell/test/connection_ui_test.dart'
      - 'tools/validate-android-gmail-bridge.mjs'
      - 'tools/validate-ci-runner-policy.mjs'
      - 'mk0/11-decisions/ADR-026-ANDROID-GOOGLE-AUTHORIZATION-BOUNDARY.md'
      - '.github/workflows/mobile-gmail-connection.yml'

permissions:
  contents: read

concurrency:
  group: financesensor-android-gmail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-gmail-connection-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Static Gmail bridge boundary
        run: node tools/validate-android-gmail-bridge.mjs

      - name: Materialize Android Kotlin scaffold
        working-directory: spikes/mobile-shell
        run: |
          flutter create \
            --platforms=android \
            --android-language=kotlin \
            --project-name=financesensor_mobile_shell \
            --org=com.financesensor.lab \
            .

      - name: Apply Android OAuth bridge
        working-directory: spikes/mobile-shell
        run: |
          python3 - <<'PY'
          from pathlib import Path

          physical_package = 'com.financesensor.lab.gmailconnection.r2'
          generated_package = 'com.financesensor.lab.financesensor_mobile_shell'
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')

          if kts.exists():
              text = kts.read_text()
              old_min = 'minSdk = flutter.minSdkVersion'
              old_target = 'targetSdk = flutter.targetSdkVersion'
              old_app_id = f'applicationId = "{generated_package}"'
              if old_min not in text or old_target not in text or old_app_id not in text:
                  raise SystemExit('EXPECTED_FLUTTER_ANDROID_BASELINE_MARKER_NOT_FOUND')
              text = text.replace(old_min, 'minSdk = 31')
              text = text.replace(old_target, 'targetSdk = 36')
              text = text.replace(old_app_id, f'applicationId = "{physical_package}"')
              if 'play-services-auth:21.6.0' not in text:
                  text += '\n\ndependencies {\n    implementation("com.google.android.gms:play-services-auth:21.6.0")\n}\n'
              kts.write_text(text)
          elif groovy.exists():
              text = groovy.read_text()
              old_min = 'minSdkVersion flutter.minSdkVersion'
              old_target = 'targetSdkVersion flutter.targetSdkVersion'
              old_app_id = f'applicationId "{generated_package}"'
              if old_min not in text or old_target not in text or old_app_id not in text:
                  raise SystemExit('EXPECTED_FLUTTER_ANDROID_BASELINE_MARKER_NOT_FOUND')
              text = text.replace(old_min, 'minSdkVersion 31')
              text = text.replace(old_target, 'targetSdkVersion 36')
              text = text.replace(old_app_id, f'applicationId "{physical_package}"')
              if 'play-services-auth:21.6.0' not in text:
                  text += '\n\ndependencies {\n    implementation "com.google.android.gms:play-services-auth:21.6.0"\n}\n'
              groovy.write_text(text)
          else:
              raise SystemExit('ANDROID_APP_GRADLE_FILE_NOT_FOUND')

          source = Path('native/android/MainActivity.kt')
          target = Path('android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt')
          if not source.exists():
              raise SystemExit('NATIVE_GMAIL_BRIDGE_SOURCE_NOT_FOUND')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source.read_text())

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in manifest_text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if marker not in manifest_text:
                  raise SystemExit('ANDROID_MANIFEST_ROOT_MARKER_NOT_FOUND')
              manifest_text = manifest_text.replace(marker, marker + '\n    ' + permission, 1)
              manifest.write_text(manifest_text)
          PY

      - name: Verify Android OAuth compile surface
        working-directory: spikes/mobile-shell
        run: |
          grep -R -E -q 'minSdk(Version)?\s*[= ]\s*31' android/app/build.gradle*
          grep -R -E -q 'targetSdk(Version)?\s*[= ]\s*36' android/app/build.gradle*
          grep -R -q 'com.financesensor.lab.gmailconnection.r2' android/app/build.gradle*
          grep -R -q 'play-services-auth:21.6.0' android/app/build.gradle*
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'Identity.getAuthorizationClient' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt
          grep -q 'https://www.googleapis.com/auth/gmail.readonly' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt
          grep -q 'DISCONNECT_BARRIER_KEY' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt
          grep -q 'verifyPreviousBearerDenied' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt
          grep -q 'oldTokenDeniedAfterRevoke' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt
          grep -q 'providerGrantReused' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell/MainActivity.kt
          ! grep -R -q 'requestOfflineAccess' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell
          ! grep -R -q 'serverAuthCode' android/app/src/main/kotlin/com/financesensor/lab/financesensor_mobile_shell
          echo 'ANDROID_OAUTH_PACKAGE=com.financesensor.lab.gmailconnection.r2'
          echo 'ANDROID_AUTHORIZATION_PROVIDER=GOOGLE_AUTHORIZATION_CLIENT'
          echo 'DURABLE_DISCONNECT_BARRIER=REQUIRED'
          echo 'POST_REVOKE_OLD_BEARER_DENIAL=REQUIRED'
          echo 'EXPLICIT_RECONNECT_GRANT_REUSE=ALLOWED'
          echo 'PASSIVE_RECONNECT=FORBIDDEN'

      - name: Resolve dependencies
        working-directory: spikes/mobile-shell
        run: flutter pub get

      - name: Analyze
        working-directory: spikes/mobile-shell
        run: flutter analyze

      - name: Widget and bridge UI tests
        working-directory: spikes/mobile-shell
        run: flutter test

      - name: Build Android Gmail connection debug APK
        working-directory: spikes/mobile-shell
        run: flutter build apk --debug --target lib/main_connected.dart

      - name: Connection APK evidence
        working-directory: spikes/mobile-shell
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-debug.apk'
          test -f "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$APK" | tee "$APK.sha256"
          APK_BYTES="$(stat -c '%s' "$APK")"
          echo "APK_BYTES=$APK_BYTES"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find -L "$SDK_ROOT/build-tools" -name apksigner -print 2>/dev/null | sort -V | tail -1 || true)"
          test -n "$APKSIGNER"
          echo "APK_SIGNER_TOOL=$(basename "$(dirname "$APKSIGNER")")/apksigner"

          CERT_INFO="$(bash "$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
          printf '%s\n' "$CERT_INFO" | grep -Ei 'certificate (SHA-256|SHA-1|MD5) digest:' || true
          RAW_SHA1="$(printf '%s\n' "$CERT_INFO" | grep -Ei 'certificate SHA-?1 digest:' | head -1 | sed -E 's/.*digest:[[:space:]]*//I')"

          test -n "$RAW_SHA1"
          HEX_SHA1="$(printf '%s' "$RAW_SHA1" | tr '[:lower:]' '[:upper:]' | tr -cd '0-9A-F')"
          test "${#HEX_SHA1}" -eq 40
          ANDROID_DEBUG_SHA1="$(printf '%s' "$HEX_SHA1" | sed 's/../&:/g;s/:$//')"
          test "$(printf '%s' "$ANDROID_DEBUG_SHA1" | tr -cd ':' | wc -c)" -eq 19

          echo "ANDROID_DEBUG_SHA1=$ANDROID_DEBUG_SHA1"
          echo 'ANDROID_OAUTH_PACKAGE=com.financesensor.lab.gmailconnection.r2'

          cat > connection-debug-evidence.txt <<EOF
          FINANCESENSOR_ANDROID_GMAIL_CONNECTION_APK=DEBUG_ONLY
          ANDROID_OAUTH_PACKAGE=com.financesensor.lab.gmailconnection.r2
          PACKAGE_COLLISION_ISOLATION=R2
          ANDROID_DEBUG_SHA1=$ANDROID_DEBUG_SHA1
          APK_SHA256=$APK_SHA256
          APK_BYTES=$APK_BYTES
          EXACT_SCOPE=gmail.readonly
          APP_REFRESH_TOKEN_CUSTODY=0
          DART_BEARER_CUSTODY=0
          OFFLINE_ACCESS_REQUESTED=0
          DURABLE_DISCONNECT_BARRIER=1
          POST_REVOKE_OLD_BEARER_DENIAL=1
          EXPLICIT_RECONNECT_GRANT_REUSE=ALLOWED
          PASSIVE_RECONNECT=FORBIDDEN
          PUBLIC_CI_SIGNER=COMPILE_ONLY_EPHEMERAL
          REAL_OAUTH_EXECUTED_BY_CI=0
          REAL_GMAIL_EXECUTED_BY_CI=0
          BUILD_READY=NO
          EOF

          cat connection-debug-evidence.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android Gmail connection APK
        uses: actions/upload-artifact@v4
        with:
          name: financesensor-android-gmail-connection-r2-debug
          path: |
            spikes/mobile-shell/build/app/outputs/flutter-apk/app-debug.apk
            spikes/mobile-shell/build/app/outputs/flutter-apk/app-debug.apk.sha256
            spikes/mobile-shell/connection-debug-evidence.txt
          if-no-files-found: error
          retention-days: 7